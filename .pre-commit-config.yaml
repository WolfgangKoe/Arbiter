repos:
  - repo: local
    hooks:
      - id: erledigteLoeschen
        name: Erledigte Anliegen löschen
        entry: python3 prozess/pruefungen/gemeinsam/lauf.py anliegenregeln.erledigteLoeschen
        language: system
        pass_filenames: false
        always_run: true
      - id: pruefungen
        name: Prüfungen (Benennung, Glossar, Importvertrag, Anliegen, Kriterium zu Test)
        entry: python3 -m pytest prozess/pruefungen -q
        language: system
        pass_filenames: false
        always_run: true
      - id: benennung
        name: Benennung nach prozess/praemissen/wir.md
        entry: python3 prozess/pruefungen/gemeinsam/lauf.py formregeln.benennung
        language: system
        pass_filenames: false
        always_run: true
      - id: sonarlint
        name: SonarLint (Standardprofil ohne Namensregeln)
        entry: python3 prozess/pruefungen/gemeinsam/lauf.py formregeln.sonarlint
        language: system
        pass_filenames: false
        files: \.py$
