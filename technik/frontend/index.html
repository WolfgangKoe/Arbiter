<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Arbiter</title>
  <link rel="stylesheet" href="komponenten.css">
  <script type="module" src="seite.js"></script>
</head>
<body>
  <header class="kopfzeile"></header>
  <main class="spielbereich">
    <aside class="leiste leisteLinks" aria-label="Armeeliste Spieler 1">
      <button class="leistenGriff" type="button" aria-expanded="true" aria-label="Armeeliste Spieler 1 ein- und ausfahren">◀</button>
      <div class="leistenInhalt"></div>
    </aside>
    <div class="spalte spalteMitte"></div>
    <aside class="leiste leisteRechts" aria-label="Armeeliste Spieler 2">
      <button class="leistenGriff" type="button" aria-expanded="true" aria-label="Armeeliste Spieler 2 ein- und ausfahren">▶</button>
      <div class="leistenInhalt"></div>
    </aside>
  </main>
  <aside class="leiste leisteUnten" aria-label="Protokoll">
    <button class="leistenGriff" type="button" aria-expanded="true" aria-label="Protokoll ein- und ausfahren">▼</button>
    <div class="leistenInhalt"></div>
  </aside>
  <template id="protokoll"><ul class="protokoll"></ul></template>
  <template id="protokollEintrag"><li class="protokollEintrag spieler1">
    <span class="protokollEinheit">Boyz</span>
    <span class="protokollSpieler">Spieler 1</span>
  </li></template>
  <template id="protokollGrund"><span class="protokollGrund">über eine Base</span></template>
  <template id="kopfzeileSpieler"><div class="kopfzeileSpieler spieler1 anDerReihe">Spieler 1<span class="kopfzeileAnDerReihe">an der Reihe</span></div></template>
  <template id="kopfzeileAmZug"><span class="kopfzeileAmZug">Schlachtrunde 1 · Kommandophase</span></template>
  <template id="kopfzeileSchlachtBeendet"><span class="kopfzeileSchlachtBeendet">Schlacht beendet</span></template>
  <template id="kopfzeileTitel"><div class="kopfzeileTitel">ARBITER</div></template>
  <template id="armeeKarte"><div class="armeeKarte spieler1"><h2 class="armeeKartenName">Spieler 1</h2></div></template>
  <template id="einheitenKarte"><section class="einheitenKarte">
    <div class="einheitenKartenName"><span>Boyz</span><span class="einheitenKartenModelle">1</span></div>
  </section></template>
  <template id="karte"><div class="spalte spalteMitte">
    <svg class="karte" viewBox="0 0 44 60" role="img" aria-label="Karte">
      <rect class="spielfeld" x="0" y="0" width="44" height="60"/>
    </svg>
  </div></template>
  <template id="sperrmeldung"><ul class="sperrmeldung"></ul></template>
  <template id="sperrmeldungGrund"><li class="sperrmeldungGrund">nicht ganz in der Zone</li></template>
  <template id="knopfGruppe"><div class="knopfGruppe"></div></template>
  <template id="knopf"><button class="knopf" type="button">zurück</button></template>
  <template id="aufstellungszone"><svg><rect class="aufstellungszone spieler1" x="0" y="0" width="9" height="60"/></svg></template>
  <template id="modell"><svg><circle class="modell spieler1" cx="2.0" cy="20" r="0.630"/></svg></template>
</body>
</html>
