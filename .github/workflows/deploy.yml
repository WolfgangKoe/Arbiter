name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Lint
        run: |
          ruff check src/
          black --check src/
          isort --check-only src/

      - name: Type check (ratchet gate)
        run: python tools/mypy_gate.py

      - name: Run tests with coverage
        run: pytest --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            SPACE="arbiter"
          else
            SPACE="arbiter-test"
          fi

          git config --global user.email "ci@arbiter"
          git config --global user.name "Arbiter CI"

          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE}" hf-space

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='hf-space' \
            --exclude='.github' \
            --exclude='.woodpecker.yml' \
            . hf-space/

          cd hf-space
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy from CodeBerg (${GITHUB_SHA::7})"
            git push
          fi
