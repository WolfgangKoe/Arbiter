display_name: Necrons — Testspiel
faction_dir: necrons
dynasty: nihilakh
# Test-Roster: deckt die Necron-weapon_swaps-Varianten ab —
# per_model per_3 (Skorpekh Reap-Blades), group swap (Lychguard Sword+Shield),
# per_model any (Lokhust Heavy Enmitic Exterminator). Homogene Einheit (Warriors)
# als trivialer Referenzfall.
units:
  # Mixed per-model wounds in one unit (Szarekh 16 + 2 Triarchal Menhirs 7) —
  # exercises the per-group-wounds path (Menhirs take wounds first).
  - id: wh40k_9e.necrons.unit.the_silent_king
    models: 3
  - id: wh40k_9e.necrons.unit.overlord
    models: 1
    wargear: [wh40k_9e.necrons.wargear.resurrection_orb]
  - id: wh40k_9e.necrons.unit.canoptek_spyder
    models: 1
  - id: wh40k_9e.necrons.unit.warriors
    models: 10
  - id: wh40k_9e.necrons.unit.skorpekh_destroyers
    models: 6
    group_loadouts:
      skorpekh:
        swaps:
          reap_blade_swap:
            - weapons: [wh40k_9e.necrons.weapon.hyperphase_reap_blade]
              count: 2
  # Aura source for skorpekh_destroyers above (B-113 Teil B): United in
  # Destruction — "re-roll a wound roll of 1" for friendly DESTROYER CULT
  # units in range.
  - id: wh40k_9e.necrons.unit.skorpekh_lord
    models: 1
  - id: wh40k_9e.necrons.unit.lychguard
    models: 10
    group_loadouts:
      lychguard:
        swaps:
          sword_and_shield:
            weapons: [wh40k_9e.necrons.weapon.hyperphase_sword]
  - id: wh40k_9e.necrons.unit.lokhust_heavy_destroyers
    models: 3
    group_loadouts:
      lokhust_heavy:
        swaps:
          exterminator_swap:
            - weapons: [wh40k_9e.necrons.weapon.enmitic_exterminator]
              count: 2
