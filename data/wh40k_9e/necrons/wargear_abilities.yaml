# Necron wargear abilities — WH40k 9E
# Source: Codex Necrons (9E, 2020) + Wahapedia verification 2026-05-30
# Format: same Ability schema as faction/unit abilities.
# wargear_id: the wargear item that grants this ability.
# Applied by loader only when the unit has this wargear in its roster selection.

faction: Necrons
abilities:

  # ── Technomancer Wargear ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.wargear.canoptek_cloak.ability
    name_en: Canoptek Cloak
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.canoptek_cloak
    rule_text: "The bearer has a Move characteristic of 10\" and the FLY keyword. In addition, at the end of your Movement phase, you can repair one friendly DYNASTY model within 3\" of this model. That model regains up to D3 lost wounds."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions: []
    effect:
      type: complex
      target: friendly_dynasty
      handler: canoptekCloak

  - id: wh40k_9e.necrons.wargear.canoptek_control_node.ability
    name_en: Canoptek Control Node
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.canoptek_control_node
    rule_text: "Aura: while a friendly DYNASTY CANOPTEK unit is within 6\" of this model, each time a model in that unit makes an attack, add 1 to that attack's hit roll."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: active
    conditions: []
    effect:
      type: buff_roll
      target: friendly_canoptek_aura
      stat: hit_roll
      modifier: 1

  # ── Lychguard Wargear ────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.wargear.dispersion_shield.ability
    name_en: Dispersion Shield
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.dispersion_shield
    rule_text: "The bearer has a 4+ invulnerable save. In addition, add 1 to armour saving throws made for the bearer."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions: []
    effect:
      type: invuln_save
      target: self
      modifier: 4

  # ── Canoptek Spyder Wargear ───────────────────────────────────────────────────

  - id: wh40k_9e.necrons.wargear.gloom_prism.ability
    name_en: Gloom Prism
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.gloom_prism
    rule_text: "In your opponent's Psychic phase, the bearer's unit can attempt to deny one psychic power as if it were a PSYKER."
    trigger:
      timing: phase_reactive
      phase: psychic
      stage: active
      player: inactive
    conditions: []
    effect:
      type: deny_psychic
      target: self

  # ── HQ Wargear ───────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.wargear.phylactery.ability
    name_en: Phylactery
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.phylactery
    rule_text: "Each time this model uses its Living Metal ability, it regains up to D3 lost wounds instead of 1."
    trigger:
      timing: phase_start
      phase: command
      stage: start
      player: active
    conditions:
      - needs_healing: true
    effect:
      type: heal
      target: self
      amount: "D3"
      revive: false

  - id: wh40k_9e.necrons.wargear.resurrection_orb.ability
    name_en: Resurrection Orb
    ability_type: activated
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.resurrection_orb
    rule_text: "Once per battle, in your Command phase, the bearer can use its resurrection orb. Select one friendly DYNASTY unit within 6\" of the bearer that is not at its Starting Strength. That unit's reanimation protocols are enacted."
    trigger:
      timing: phase_any
      phase: command
      stage: active
      player: active
    conditions:
      - within_inches: 6
        max_uses: 1
    effect:
      type: complex
      target: selected_unit
      handler: resurrectionOrb

  # ── Tomb Blade Wargear ───────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.wargear.nebuloscope.ability
    name_en: Nebuloscope
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.nebuloscope
    rule_text: "Each time the bearer makes a ranged attack, the target does not receive the benefits of cover against that attack."
    trigger:
      timing: persistent
      phase: shooting
      stage: active
      player: active
    conditions: []
    effect:
      type: ignore_cover
      target: self

  - id: wh40k_9e.necrons.wargear.shadowloom.ability
    name_en: Shadowloom
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.shadowloom
    rule_text: "The bearer has a 5+ invulnerable save."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions: []
    effect:
      type: invuln_save
      target: self
      modifier: 5

  - id: wh40k_9e.necrons.wargear.shieldvanes.ability
    name_en: Shieldvanes
    ability_type: triggered
    source: wargear
    wargear_id: wh40k_9e.necrons.wargear.shieldvanes
    rule_text: "The bearer has a Save characteristic of 3+."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions: []
    effect:
      type: passive_stat
      target: self
      stat: save
      modifier: 3

# ── Cryptek Arkana ────────────────────────────────────────────────────────────
# Arkana sind spezielle Ausrüstung exklusiv für CRYPTEK-Modelle.
# Format weicht vom standard Ability-Schema ab (kein trigger/effect) —
# geladen via load_arkana() (noch nicht implementiert), nicht via load_wargear_abilities().
# Quelle: Codex Necrons 9E, S. 61 (draft_from_user_image)

arkana:
  - id: wh40k_9e.necrons.arkana.failsafe_overcharger
    name_en: Failsafe Overcharger
    name_de: Sicherungsüberlader
    power_delta: 2
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Nur für ein TECHNOMANT-Modell. In deiner Befehlsphase kannst du eine
      befreundete KANOPTECH-Einheit innerhalb von 9 Zoll um den Träger
      auswählen. Addiere bis zum Beginn deiner nächsten Befehlsphase 1 zum
      Attackenwert der Modelle der gewählten Einheit. Wenn die Einheit eine
      MONSTER- oder FAHRZEUG-Einheit ist, addiere W3 zum Attackenwert der
      Modelle statt 1.

  - id: wh40k_9e.necrons.arkana.countertemporal_nanomines
    name_en: Countertemporal Nanomines
    name_de: Antitemporale Nanominen
    power_delta: 2
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Nur für ein CHRONOMANT-Modell. In deiner Fernkampfphase kannst du eine
      feindliche Einheit innerhalb von 18 Zoll um den Träger auswählen.
      Halbiere bis zum Beginn deines nächsten Zuges jeden Vorrücken- und
      Angriffswurf für die gewählte Einheit.

  - id: wh40k_9e.necrons.arkana.atavindicator
    name_en: Atavindicator
    name_de: Atavindicator
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Nur für ein PSYCHOMANT-Modell. Wähle am Ende deiner Bewegungsphase eine
      feindliche Einheit (ausgenommen FAHRZEUG-Einheiten) innerhalb von
      18 Zoll um den Träger und wirf 3W6; wenn die Summe dem Moralwert der
      gewählten Einheit entspricht oder höher ist, erleidet die feindliche
      Einheit W3 tödliche Verwundungen.

  - id: wh40k_9e.necrons.arkana.dimensional_sanctum
    name_en: Dimensional Sanctum
    name_de: Dimensionszuflucht
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    grants_ability: wh40k_9e.necrons.unit.dimensional_translocation
    text_de: >
      Der Träger erhält die Fähigkeit Dimensionale Translokation (Seite 80).

  - id: wh40k_9e.necrons.arkana.hypermaterial_ablator
    name_en: Hypermaterial Ablator
    name_de: Hypermaterial-Abtrager
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      In deiner Befehlsphase kannst du eine befreundete
      <DYNASTIE>-KERN- oder <DYNASTIE>-KANOPTECH-Einheit innerhalb von
      9 Zoll um den Träger auswählen. Bis zum Beginn deiner nächsten
      Befehlsphase wird die gewählte Einheit bei jeder Fernkampfattacke gegen
      sich behandelt, als profitiere sie von leichter Deckung.

  - id: wh40k_9e.necrons.arkana.cortical_subjugator_scarabs
    name_en: Cortical Subjugator Scarabs
    name_de: Kortikale Unterwerfungsskarabäen
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Einmal pro Schlacht kannst du zu Beginn des Schritts Heroische
      Interventionen in der Angriffsphase deines Gegners eine befreundete
      <DYNASTIE>-Einheit innerhalb von 6 Zoll um den Träger auswählen. Sofern
      sich die Einheit nicht in Nahkampfreichweite einer feindlichen Einheit
      befindet, kann sie wie ein CHARAKTERMODELL eine Heroische Intervention
      durchführen.

  - id: wh40k_9e.necrons.arkana.cryptogeometric_adjuster
    name_en: Cryptogeometric Adjuster
    name_de: Kryptogeometrischer Regler
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Zu Beginn der Fernkampfphase deines Gegners kannst du eine feindliche
      Einheit auswählen, die sich innerhalb von 12 Zoll befindet und für den
      Träger sichtbar ist. Ziehe bis zum Ende der Phase bei jeder Attacke
      eines Modells der gewählten Einheit 1 vom Trefferwurf ab.

  - id: wh40k_9e.necrons.arkana.metalodermal_tesla_weave
    name_en: Metalodermal Tesla Weave
    name_de: Metallodermales Tesla-Gewebe
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Am Ende des Schritts Angriffe in der Angriffsphase deines Gegners kannst
      du eine feindliche Einheit auswählen, die in dieser Phase eine
      Angriffsbewegung innerhalb von 6 Zoll um den Träger beendet hat. Wirf
      einen W6; bei 2+ erleidet die feindliche Einheit W3 tödliche
      Verwundungen.

  - id: wh40k_9e.necrons.arkana.photonic_transubjector
    name_en: Photonic Transubjector
    name_de: Photonischer Transpersonalisator
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Einmal pro Zug, wenn das erste Mal ein Schutzwurf für den Träger
      misslingt, wird der Schadenswert der Attacke zu 0 geändert.

  - id: wh40k_9e.necrons.arkana.phylacterine_hive
    name_en: Phylacterine Hive
    name_de: Phylakterienschwarm
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Nur für ein TECHNOMANT-Modell. Einmal pro Schlacht kannst du, wenn der
      Träger seine Fähigkeit Riten der Reanimation einsetzt, eine
      befreundete <DYNASTIE>-KANOPTECH-, <DYNASTIE>-DESTRUKTORKULT- oder
      TRIARCHAT-PRÄTORIANER-Einheit auswählen, die statt einer befreundeten
      <DYNASTIE>-KERN-Einheit von der Fähigkeit betroffen wird.

  - id: wh40k_9e.necrons.arkana.prismatic_obfuscatron
    name_en: Prismatic Obfuscatron
    name_de: Prismatischer Obfuskierer
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Solange der Träger nicht das nächste infrage kommende Ziel ist, können
      feindliche Modelle ihn nicht als Ziel für Fernkampfattacken auswählen.

  - id: wh40k_9e.necrons.arkana.quantum_orb
    name_en: Quantum Orb
    name_de: Quantensphäre
    power_delta: 1
    applies_to:
      keywords: [CRYPTEK]
    text_de: >
      Nur für ein PLASMANT-Modell. Einmal pro Schlacht kann der Träger in
      deiner Befehlsphase diesen Gegenstand der Kryptomanten-Arkana
      aktivieren. Wähle einen beliebigen Punkt auf dem Schlachtfeld innerhalb
      von 24 Zoll um den Träger. Wirf zu Beginn deiner nächsten Befehlsphase
      einen W6 für jede Einheit innerhalb von 6 Zoll um diesen Punkt.
