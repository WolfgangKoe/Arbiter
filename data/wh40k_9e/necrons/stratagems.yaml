# Necron stratagems — WH40k 9E
# Source: Wahapedia 2026-05-31 (https://wahapedia.ru/wh40k9ed/factions/necrons/)
# Format matches gameObjects/stratagem.py Stratagem dataclass.
# Loader support: Ziel 5c (not yet loaded at runtime).
#
# conditions: unit must have ALL listed keywords to qualify.
# detachment: if set, stratagem requires this detachment type.
# phase: phase in which the stratagem may be used.
# stage: "start" | "active" | "end"
# player: "active" | "inactive" | "both"
# cp_cost: minimum CP cost; variable costs are explained in rule_text.
#
# EXCLUDED: Boarding Actions supplement stratagems (NANOSCARAB VIRUS,
#   MINDSHACKLE SCARABS) — require Hatchway mechanics from that supplement.
# Total: 59 stratagems (37 Core + 6 Dynastic + 8 Cult of the Cryptek + 8 Annihilation Legion)

stratagems:

  # ── Core — Before Battle ───────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.hand_of_the_phaeron
    name_en: Hand of the Phaeron
    cp_cost: 2
    phase: before_battle
    stage: active
    player: active
    conditions: [OVERLORD]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle, when you are mustering your army. If your army does not contain a model with the PHAERON keyword, select one NECRONS OVERLORD model from your army (excluding named characters). That model gains the PHAERON keyword, and in your Command phase it can use its My Will Be Done ability one additional time. You can only use this Stratagem once."

  - id: wh40k_9e.necrons.stratagem.dynastic_heirlooms
    name_en: Dynastic Heirlooms
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle, when you are mustering your army, if your WARLORD has the NECRONS keyword. Select one NECRONS CHARACTER model (excluding C'TAN SHARD models) in your army and give them one Relic (this must be a Relic they can have). Each Relic in your army must be unique, and you cannot use this Stratagem to give a model two Relics. You can only use this Stratagem once, unless you are playing a Strike Force battle (in which case you can use this Stratagem twice), or an Onslaught battle (in which case you can use this Stratagem three times)."

  - id: wh40k_9e.necrons.stratagem.rarefied_nobility
    name_en: Rarefied Nobility
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle, when you are mustering your army, if your WARLORD has the NECRONS keyword. Select one NECRONS CHARACTER model (excluding C'TAN SHARD models) in your army and determine one Warlord Trait for that model (this must be a Warlord Trait they can have); that model is only regarded as your WARLORD for the purposes of that Warlord Trait. Each Warlord Trait in your army must be unique (if randomly generated, re-roll duplicate results), and you cannot use this Stratagem to give a model two Warlord Traits. You can only use this Stratagem once, unless you are playing a Strike Force battle (in which case you can use this Stratagem twice), or an Onslaught battle (in which case you can use this Stratagem three times)."

  # ── Core — Command Phase ───────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.strange_echoes
    name_en: Strange Echoes
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one C'TAN SHARD model from your army. Select one of the powers from the Powers of the C'tan that the model does not know. The selected power replaces one of the Powers of the C'tan that the model does know."

  - id: wh40k_9e.necrons.stratagem.the_deathless_arise
    name_en: The Deathless Arise
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [TECHNOMANCER]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one TECHNOMANCER model from your army. Until the end of the phase, that model can use its Rites of Reanimation ability one additional time."

  - id: wh40k_9e.necrons.stratagem.reconstitution_protocols
    name_en: Reconstitution Protocols
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [GHOST ARK]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one GHOST ARK unit from your army. Until the end of the phase, each time that unit uses its Repair Barge ability, you can set up to D6 destroyed models back up on the battlefield, instead of D3."

  - id: wh40k_9e.necrons.stratagem.stellar_alignment_protocol
    name_en: Stellar Alignment Protocol
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [VEHICLE]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Command phase. Select one NECRONS VEHICLE model from your army that has a Wounds characteristic of 10 or more. Until the start of your next Command phase, that model is considered to have its full wounds remaining for the purposes of determining what characteristics on its profile to use. If that model has the TITANIC keyword, this Stratagem costs 2CP; otherwise it costs 1CP."

  # ── Core — Movement Phase ──────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.dimensional_corridor
    name_en: Dimensional Corridor
    cp_cost: 1
    phase: movement
    stage: start
    player: active
    conditions: [CORE, INFANTRY]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Movement phase. Select one <DYNASTY> CORE INFANTRY unit from your army that is on the battlefield. Remove that unit from the battlefield. In the Reinforcements step of this phase, set that unit back up on the battlefield anywhere that is wholly within 3\" of a friendly <DYNASTY> MONOLITH model and more than 9\" away from any enemy models."

  - id: wh40k_9e.necrons.stratagem.burrowing_nightmares
    name_en: Burrowing Nightmares
    cp_cost: 1
    phase: movement
    stage: start
    player: active
    conditions: [OPHYDIAN DESTROYERS]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Movement phase. Select one OPHYDIAN DESTROYERS unit from your army that is on the battlefield. Remove that unit from the battlefield. In the Reinforcements step of your next Movement phase, you can set that unit back up on the battlefield anywhere that is more than 9\" away from any enemy models. If the battle ends and that unit is not on the battlefield, it is destroyed."

  - id: wh40k_9e.necrons.stratagem.prismatic_dimensional_breach
    name_en: Prismatic Dimensional Breach
    cp_cost: 1
    phase: movement
    stage: active
    player: active
    conditions: [CORE]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Reinforcements step of your Movement phase. Select one <DYNASTY> CORE unit from your army that is in Strategic Reserves, and then select one friendly <DYNASTY> NIGHT SCYTHE or <DYNASTY> MONOLITH model that is on the battlefield. Set that CORE unit up anywhere on the battlefield that is wholly within 3\" of that NIGHT SCYTHE or MONOLITH model and not within Engagement Range of any enemy units. This Stratagem cannot be used in the first battle round."

  - id: wh40k_9e.necrons.stratagem.dimensional_destabilisation
    name_en: Dimensional Destabilisation
    cp_cost: 1
    phase: movement
    stage: end
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of your Movement phase, when a C'TAN SHARD model from your army has used a Power of the C'tan. Roll one D6; that model can immediately use the corresponding power from the Powers of the C'tan, even if it has already been used this turn. If that model has the TITANIC keyword, this Stratagem costs 2CP; otherwise it costs 1CP."

  - id: wh40k_9e.necrons.stratagem.aetheric_interception
    name_en: Aetheric Interception
    cp_cost: 1
    phase: movement
    stage: active
    player: inactive
    conditions: [HYPERSPACE HUNTER]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Reinforcements step of your opponent's Movement phase, after an enemy unit has been set up on the battlefield. Select one HYPERSPACE HUNTER unit from your army that is either on the battlefield, in a hyperspace dimension or in Strategic Reserves. If that HYPERSPACE HUNTER unit is in a hyperspace dimension or in Strategic Reserves, set it up anywhere on the battlefield that is within 18\" of that enemy unit and more than 9\" away from any enemy models. That HYPERSPACE HUNTER unit can, at the end of the phase, shoot as if it were your Shooting phase, but until the end of the phase it can only target the enemy unit that was just set up on the battlefield (and only if that enemy unit is an eligible target for that attack)."

  # ── Core — Charge Phase ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.enslaved_protectors
    name_en: Enslaved Protectors
    cp_cost: 1
    phase: charge
    stage: active
    player: inactive
    conditions: [CANOPTEK]
    once_per_phase: true
    rule_text: "Use this Stratagem in your opponent's Charge phase. Select one CANOPTEK unit from your army. Until the end of the phase, that unit is eligible to perform Heroic Interventions as if it was a CHARACTER."

  # ── Core — Shooting Phase ──────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.techno_oracular_targeting
    name_en: Techno-Oracular Targeting
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, before making the wound roll for an attack made by a NECRONS model from your army. Do not make a wound roll for that attack: it automatically wounds the target."

  - id: wh40k_9e.necrons.stratagem.extermination_protocols
    name_en: Extermination Protocols
    cp_cost: 2
    phase: shooting
    stage: active
    player: active
    conditions: [LOKHUST DESTROYERS]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a LOKHUST DESTROYERS or LOKHUST HEAVY DESTROYERS unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack, you can re-roll the wound roll."

  - id: wh40k_9e.necrons.stratagem.fractal_targeting
    name_en: Fractal Targeting
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [TOMB BLADES]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase. Select one TOMB BLADES unit from your army. Until the end of the phase: All Rapid Fire weapons that models in that unit are equipped with are treated as being Assault 2 weapons. Models in that unit do not suffer the penalty to hit rolls incurred for firing Assault weapons in the same turn that their unit has Advanced."

  - id: wh40k_9e.necrons.stratagem.disintegration_capacitors
    name_en: Disintegration Capacitors
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a NECRONS unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a gauss weapon, an unmodified hit roll of 6 automatically wounds the target."

  - id: wh40k_9e.necrons.stratagem.malevolent_arcing
    name_en: Malevolent Arcing
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a NECRONS model from your army targets an enemy unit with a tesla weapon. After making that weapon's attacks, roll one D6 for each other unit within 6\" of that enemy unit: on a 4+, the unit being rolled for suffers 1 mortal wound."

  - id: wh40k_9e.necrons.stratagem.relentless_onslaught
    name_en: Relentless Onslaught
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [CORE, INFANTRY]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a CORE INFANTRY unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a Rapid Fire weapon, an unmodified hit roll of 6 scores one additional hit."

  - id: wh40k_9e.necrons.stratagem.reanimation_prioritisation
    name_en: Reanimation Prioritisation
    cp_cost: 2
    phase: shooting
    stage: active
    player: inactive
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your opponent's Shooting phase, when a NECRONS unit from your army is selected as the target of an attack. Select one CANOPTEK REANIMATOR model in your army that is within 6\" of and visible to the targeted unit. That model can use its Nanoscarab Reanimation Beam ability as if it was your Command phase, selecting the targeted unit to be healed by its reanimation beam (any unit that was already being healed by that model's reanimation beam is no longer considered to be healed by it)."

  - id: wh40k_9e.necrons.stratagem.solar_pulse
    name_en: Solar Pulse
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase. Select one enemy unit. Until the end of the phase, each time a model in a NECRONS unit from your army makes a ranged attack against that enemy unit, the target does not receive the benefits of cover against that attack."

  - id: wh40k_9e.necrons.stratagem.atavistic_instigation
    name_en: Atavistic Instigation
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [DOOM SCYTHE]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a DOOM SCYTHE model from your army is selected to shoot. After you select the target unit for that model's heavy death ray, select one enemy unit within 3\" of that target (you can select the target itself if you wish); that enemy unit can either brace or duck for cover. If that unit braces, and it is not a VEHICLE or a MONSTER unit, it suffers D3 mortal wounds. If that unit ducks for cover, then until the end of the turn, subtract 1 from the Attacks characteristic of models in that unit, and that unit cannot fire Overwatch or Set to Defend."

  - id: wh40k_9e.necrons.stratagem.shield_piercer_projectors
    name_en: Shield-Piercer Projectors
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a NECRONS model from your army shoots with a ranged weapon. Until the end of the phase, each time that model makes an attack with that weapon, invulnerable saving throws cannot be taken against that attack."

  - id: wh40k_9e.necrons.stratagem.flensing_capacitors
    name_en: Flensing Capacitors
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a NECRONS unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a gauss weapon, an unmodified successful hit roll of 5+ automatically wounds the target."

  # ── Core — Fight Phase ─────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.storm_of_flensing_blades
    name_en: Storm of Flensing Blades
    cp_cost: 2
    phase: fight
    stage: end
    player: active
    conditions: [FLAYED ONES]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of the Fight phase. Select one FLAYED ONES unit from your army within Engagement Range of any enemy units; that unit can fight again."

  - id: wh40k_9e.necrons.stratagem.judgement_of_the_triarch
    name_en: Judgement of the Triarch
    cp_cost: 1
    phase: any
    stage: active
    player: active
    conditions: [TRIARCH]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a TRIARCH unit is selected to shoot, or in the Fight phase, when a TRIARCH unit is selected to fight. Until the end of the phase, each time a model in that unit makes an attack, add 1 to that attack's hit roll."

  - id: wh40k_9e.necrons.stratagem.eternal_protectors
    name_en: Eternal Protectors
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [LYCHGUARD]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase. Select a <DYNASTY> LYCHGUARD unit from your army. Until the end of the phase, while that unit is within 3\" of a friendly <DYNASTY> NOBLE model, add 1 to the Attacks characteristic of each model in that unit."

  - id: wh40k_9e.necrons.stratagem.disruption_fields
    name_en: Disruption Fields
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [CORE]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when a NECRONS CORE unit from your army is selected to fight. Until the end of the phase, add 1 to the Strength characteristic of models in that unit."

  - id: wh40k_9e.necrons.stratagem.whirling_onslaught
    name_en: Whirling Onslaught
    cp_cost: 1
    phase: any
    stage: active
    player: inactive
    conditions: [DESTROYER CULT]
    once_per_phase: true
    rule_text: "Use this Stratagem in any phase, when a SKORPEKH DESTROYERS or SKORPEKH LORD unit from your army is selected as the target of an attack. Until the end of the phase, each time an attack is made against that unit, subtract 1 from that attack's wound roll."

  - id: wh40k_9e.necrons.stratagem.entropic_strike
    name_en: Entropic Strike
    cp_cost: 2
    phase: fight
    stage: active
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when a C'TAN SHARD model from your army is selected to fight. Until the end of the phase, each time a melee attack is made by that model, invulnerable saving throws cannot be taken against that attack."

  - id: wh40k_9e.necrons.stratagem.self_destruction
    name_en: Self-Destruction
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [CANOPTEK SCARAB SWARMS]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when a CANOPTEK SCARAB SWARMS unit from your army is selected to fight. Select one model in that unit. After that unit has finished piling in, you can select one enemy unit within Engagement Range of that model and roll one D6: on a 2-5, that enemy unit suffers D3 mortal wounds; on a 6, that enemy unit suffers 3 mortal wounds. The CANOPTEK SCARAB SWARM model is then destroyed."

  # ── Core — Any Phase ──────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.resurrection_protocols
    name_en: Resurrection Protocols
    cp_cost: 1
    phase: any
    stage: end
    player: both
    conditions: [INFANTRY]
    once_per_phase: false
    rule_text: "Use this Stratagem in any phase, when a NECRONS INFANTRY NOBLE or NECRONS INFANTRY CRYPTEK model from your army is destroyed. You can choose to roll one D6 at the end of the phase instead of using any rules that are triggered when that model is destroyed. If you do, then on a 4+, set that model back up on the battlefield as close as possible to where they were destroyed and more than 1\" away from any enemy models, with D3 wounds remaining. This Stratagem cannot be used to set the same model back up more than once per battle."

  - id: wh40k_9e.necrons.stratagem.quantum_deflection
    name_en: Quantum Deflection
    cp_cost: 1
    phase: any
    stage: active
    player: inactive
    conditions: [QUANTUM SHIELDING]
    once_per_phase: true
    rule_text: "Use this Stratagem in any phase, when a NECRONS QUANTUM SHIELDING unit from your army is selected as the target of an attack. Until the end of the phase, models in that unit have a 4+ invulnerable save."

  - id: wh40k_9e.necrons.stratagem.curse_of_the_phaeron
    name_en: Curse of the Phaeron
    cp_cost: 1
    phase: any
    stage: active
    player: both
    conditions: [VEHICLE]
    once_per_phase: false
    rule_text: "Use this Stratagem in any phase, when a NECRONS VEHICLE model from your army is destroyed. Do not roll to see if that model explodes: it does so automatically. If that model has the TITANIC keyword, this Stratagem costs 3CP; otherwise it costs 1CP."

  - id: wh40k_9e.necrons.stratagem.shadows_of_drazak
    name_en: Shadows of Drazak
    cp_cost: 1
    phase: any
    stage: active
    player: inactive
    conditions: [FLAYED ONES]
    once_per_phase: true
    rule_text: "Use this Stratagem in any phase, when a FLAYED ONES unit from your army is selected as the target of an attack. Until the end of the phase, each time an attack is made against that unit, subtract 1 from that attack's hit roll."

  - id: wh40k_9e.necrons.stratagem.revenge_of_the_doomstalker
    name_en: Revenge of the Doomstalker
    cp_cost: 2
    phase: any
    stage: active
    player: both
    conditions: [CANOPTEK DOOMSTALKER]
    once_per_phase: false
    rule_text: "Use this Stratagem in any phase, when a <DYNASTY> CHARACTER unit from your army is destroyed by an enemy unit. Select one friendly <DYNASTY> CANOPTEK DOOMSTALKER model from your army. At the end of the phase, that CANOPTEK DOOMSTALKER model can shoot as if it were your Shooting phase, but it can only target that enemy unit (and only if that enemy unit is an eligible target for that attack). Until the end of the battle, each time that CANOPTEK DOOMSTALKER model makes an attack that targets that enemy unit, add 1 to that attack's hit roll."

  - id: wh40k_9e.necrons.stratagem.rapid_reanimation
    name_en: Rapid Reanimation
    cp_cost: 1
    phase: any
    stage: active
    player: active
    conditions: []
    once_per_phase: false
    rule_text: "Use this Stratagem when a unit from your army has its reanimation protocols enacted. Until the end of the phase, add 1 to all reanimation protocols rolls made for that unit. If you have a CRYPTEK model or a CHARACTER model equipped with a Resurrection Orb on the battlefield, this Stratagem costs 1CP; otherwise, it costs 2CP."

  # ── Dynastic Stratagems ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.talent_for_annihilation
    name_en: Talent for Annihilation
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [MEPHRIT]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a MEPHRIT unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack, an unmodified wound roll of 6 inflicts 1 mortal wound on the target in addition to any normal damage (a maximum of 3 mortal wounds can be inflicted per phase via this Stratagem)."

  - id: wh40k_9e.necrons.stratagem.translocation_crypt
    name_en: Translocation Crypt
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: [NEPHREKH]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle when declaring reserves and transports (if you are playing a mission without this step, use this Stratagem during deployment instead). Select one NEPHREKH unit (excluding VEHICLE or MONSTER units) from your army. That unit gains the Dimensional Translocation ability."

  - id: wh40k_9e.necrons.stratagem.reclaim_a_lost_empire
    name_en: Reclaim a Lost Empire
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [NIHILAKH, INFANTRY]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase. Select one NIHILAKH INFANTRY unit from your army that is currently performing an action. That unit can still shoot this phase without that action failing."

  - id: wh40k_9e.necrons.stratagem.blood_rites
    name_en: Blood Rites
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [NOVOKH]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when a NOVOKH unit from your army is selected to fight. Until the end of the phase, add 1 to the Attacks characteristic of models in that unit."

  - id: wh40k_9e.necrons.stratagem.methodical_destruction
    name_en: Methodical Destruction
    cp_cost: 2
    phase: shooting
    stage: active
    player: active
    conditions: [SAUTEKH]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, after a SAUTEKH unit from your army has finished making its attacks. Select one enemy unit that was targeted by an attack made by a model in that unit this phase. Until the end of the phase, each time an attack is made by a model in another friendly SAUTEKH unit against that enemy unit, add 1 to that attack's hit roll."

  - id: wh40k_9e.necrons.stratagem.empyric_damping
    name_en: Empyric Damping
    cp_cost: 1
    phase: psychic
    stage: active
    player: inactive
    conditions: [SZAREKHAN]
    once_per_phase: true
    rule_text: "Use this Stratagem in your opponent's Psychic phase, when an enemy PSYKER attempts to manifest a psychic power within 18\" of a SZAREKHAN unit from your army. Roll one D6: on a 4+, that psychic power is denied."

  # ── Cult of the Cryptek Stratagems ────────────────────────────────────────
  # Require: Cult of the Cryptek Detachment

  - id: wh40k_9e.necrons.stratagem.exalted_cryptek
    name_en: Exalted Cryptek
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CRYPTEK]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle, when you are mustering your army. Select one CRYPTEK model from your army. That model can be equipped with two items of Cryptek Arkana instead of one. You can only use this Stratagem once, unless you are playing a Strike Force battle (in which case you can use this Stratagem twice), or an Onslaught battle (in which case you can use this Stratagem three times)."

  - id: wh40k_9e.necrons.stratagem.the_swarm_descends
    name_en: The Swarm Descends
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK SCARAB SWARMS]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle. Select one CANOPTEK SCARAB SWARM unit from your army. That unit gains the Dimensional Translocation ability."

  - id: wh40k_9e.necrons.stratagem.overkill_protocols
    name_en: Overkill Protocols
    cp_cost: 1
    phase: command
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK WRAITHS]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one CANOPTEK WRAITHS unit from your army. Until the start of your next Command phase: Each time a model in that unit makes an attack with vicious claws, improve the Armour Penetration characteristic of that attack by 1. Each time a model in that unit makes an attack with whip coils, make one additional hit roll."

  - id: wh40k_9e.necrons.stratagem.aggression_overrides
    name_en: Aggression Overrides
    cp_cost: 1
    phase: command
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK SPYDERS]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one CANOPTEK SPYDERS unit from your army. Until the start of your next Command phase: Add 2\" to the Move characteristic of models in that unit. Change the Weapon Skill characteristic of models in that unit to 2+."

  - id: wh40k_9e.necrons.stratagem.stalking_annihilator
    name_en: Stalking Annihilator
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK DOOMSTALKER]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase. Select one CANOPTEK DOOMSTALKER model from your army that made a Normal Move or Fell Back this turn. That model is eligible to shoot this turn. When it does so, you can select the high power profile of that model's doomsday blaster even though that model did not Remain Stationary this turn."

  - id: wh40k_9e.necrons.stratagem.hyperdense_particle_beams
    name_en: Hyperdense Particle Beams
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CULT OF THE CRYPTEK]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Shooting phase, when a CULT OF THE CRYPTEK unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a particle beamer or particle caster, improve the Armour Penetration characteristic of that attack by 2."

  - id: wh40k_9e.necrons.stratagem.enhanced_gloom_prism
    name_en: Enhanced Gloom Prism
    cp_cost: 1
    phase: psychic
    stage: active
    player: inactive
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK SPYDERS]
    once_per_phase: true
    rule_text: "Use this Stratagem in your opponent's Psychic phase, before you take a Deny the Witch test for a CANOPTEK SPYDERS unit from your army. Add 2 to the result of that test."

  - id: wh40k_9e.necrons.stratagem.canoptek_overdrive
    name_en: Canoptek Overdrive
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    detachment: cult_of_the_cryptek
    conditions: [CANOPTEK WRAITHS]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when a CANOPTEK WRAITHS model from your army is destroyed. Until the end of the phase, each time a model in this unit is destroyed by a melee attack, if that model has not fought this phase, do not remove it from play. The destroyed model can fight after the attacking model's unit has finished making attacks, and is then removed from play."

  # ── Annihilation Legion Stratagems ────────────────────────────────────────
  # Require: Annihilation Legion Detachment

  - id: wh40k_9e.necrons.stratagem.a_moment_of_clarity
    name_en: A Moment of Clarity
    cp_cost: 2
    phase: command
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [ANNIHILATION LEGION]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Command phase. Select one ANNIHILATION LEGION unit from your army. Until the start of your next Command phase, that unit has the Objective Secured ability."

  - id: wh40k_9e.necrons.stratagem.canoptek_reinforcement
    name_en: Canoptek Reinforcement
    cp_cost: 1
    phase: movement
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [CANOPTEK PLASMACYTE]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Reinforcement step of your Movement phase. Select one CANOPTEK PLASMACYTE unit from your army that has been destroyed. Set that unit up again anywhere on the battlefield within 3\" of a friendly DESTROYER CULT unit and not within Engagement Range of any enemy models. You can only use this Stratagem once."

  - id: wh40k_9e.necrons.stratagem.swift_dismemberment
    name_en: Swift Dismemberment
    cp_cost: 1
    phase: charge
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [DESTROYER CULT]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Charge phase. Select one DESTROYER CULT unit from your army. Until the end of the turn, that unit is eligible to charge in a turn in which it Advanced."

  - id: wh40k_9e.necrons.stratagem.weaponised_bodies
    name_en: Weaponised Bodies
    cp_cost: 2
    phase: charge
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [DESTROYER CULT]
    once_per_phase: true
    rule_text: "Use this Stratagem in your Charge phase, when a DESTROYER CULT unit from your army finishes a charge move. Select one enemy unit within Engagement Range of that DESTROYER CULT unit. For each model in that DESTROYER CULT unit that is within Engagement Range of that enemy unit, roll a number of D6 equal to that model's Wounds characteristic. For each result of 5+, that enemy unit suffers 1 mortal wound (to a maximum of 6 mortal wounds)."

  - id: wh40k_9e.necrons.stratagem.efficient_disintegration
    name_en: Efficient Disintegration
    cp_cost: 2
    phase: any
    stage: active
    player: both
    detachment: annihilation_legion
    conditions: [LOKHUST DESTROYERS]
    once_per_phase: true
    rule_text: "Use this Stratagem in any phase, when a LOKHUST DESTROYERS or LOKHUST HEAVY DESTROYERS unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a gauss cannon or gauss destructor, add 1 to the damage roll for that attack."

  - id: wh40k_9e.necrons.stratagem.hyperphase_impalement
    name_en: Hyperphase Impalement
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [OPHYDIAN DESTROYERS]
    once_per_phase: true
    rule_text: "Use this Stratagem in the Fight phase, when an OPHYDIAN DESTROYERS unit from your army is selected to fight. Until that fight is resolved, each time a model in that unit makes a melee attack, rules that ignore wounds cannot be used."

  - id: wh40k_9e.necrons.stratagem.lurking_murderers
    name_en: Lurking Murderers
    cp_cost: 1
    phase: fight
    stage: start
    player: active
    detachment: annihilation_legion
    conditions: [FLAYED ONES]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of the Fight phase. Select one FLAYED ONES unit from your army that is wholly within an Area Terrain feature. Until the end of the phase, each time a model in that unit makes an attack, you can re-roll the wound roll. If that unit contains 11 or more models this Stratagem costs 2CP; otherwise, it costs 1CP."

  - id: wh40k_9e.necrons.stratagem.murderous_demise
    name_en: Murderous Demise
    cp_cost: 2
    phase: fight
    stage: active
    player: active
    detachment: annihilation_legion
    conditions: [CHARACTER]
    once_per_phase: false
    rule_text: "Use this Stratagem in the Fight phase, when a CHARACTER model from your army that has not already been selected to fight this phase is destroyed, instead of using any other abilities that trigger when that model is destroyed. Do not remove that model from play - after the attacking model's unit has finished making attacks, that destroyed model can either shoot as if it were your Shooting phase, or be selected to fight. After resolving the destroyed model's attacks, it is then removed."
