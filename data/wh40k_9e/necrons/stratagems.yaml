# Necron stratagems — WH40k 9E
# Source: Codex Necrons (9E, 2020) + Wahapedia verification 2026-05-30
# Format matches gameObjects/stratagem.py Stratagem dataclass.
# Loader support: Ziel 5c (not yet loaded at runtime).
#
# conditions: list of keywords — unit must have ALL listed keywords to qualify.
# phase: the phase in which the stratagem may be used.
# stage: "start" | "active" | "end"
# player: "active" | "inactive" | "both"

stratagems:

  # ── Before Battle ─────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.hand_of_the_phaeron
    name_en: Hand of the Phaeron
    cp_cost: 2
    phase: before_battle
    stage: active
    player: active
    conditions: [OVERLORD]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle. Select one OVERLORD model from your army — that model is your Phaeron. Each time that model uses My Will Be Done, you can select up to 2 friendly DYNASTY CORE units within 9\" instead of 1."

  - id: wh40k_9e.necrons.stratagem.dynastic_heirlooms
    name_en: Dynastic Heirlooms
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: [WARLORD]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle. Select one WARLORD model from your army — that model gains one Relic of the Aeons. You can only use this Stratagem once."

  - id: wh40k_9e.necrons.stratagem.rarefied_nobility
    name_en: Rarefied Nobility
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: [WARLORD]
    once_per_phase: true
    rule_text: "Use this Stratagem before the battle. Select one WARLORD model from your army — that model gains one Warlord Trait. You can only use this Stratagem once."

  # ── Command Phase ──────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.strange_echoes
    name_en: Strange Echoes
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Command phase. Select one C'TAN SHARD model from your army — remove one C'tan Power from that model and replace it with another C'tan Power from your army's C'tan Powers list."

  - id: wh40k_9e.necrons.stratagem.the_deathless_arise
    name_en: The Deathless Arise
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [TECHNOMANCER]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Command phase. Select one friendly TECHNOMANCER model from your army — that model can use its Rites of Reanimation ability one additional time this phase."

  - id: wh40k_9e.necrons.stratagem.reconstitution_protocols
    name_en: Reconstitution Protocols
    cp_cost: 1
    phase: command
    stage: active
    player: active
    conditions: [GHOST ARK]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Command phase. Select one friendly GHOST ARK model from your army — until the end of the phase, when that model uses its Repair Barge ability, it restores D6 models instead of D3."

  # ── Movement Phase ─────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.dimensional_corridor
    name_en: Dimensional Corridor
    cp_cost: 1
    phase: movement
    stage: active
    player: active
    conditions: [CORE, INFANTRY]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of your Movement phase. Select one DYNASTY CORE INFANTRY unit from your army that is within 3\" of a friendly MONOLITH model — remove that unit from the battlefield and set it up anywhere within 3\" of another friendly MONOLITH model that is more than 9\" from any enemy models."

  - id: wh40k_9e.necrons.stratagem.burrowing_nightmares
    name_en: Burrowing Nightmares
    cp_cost: 1
    phase: movement
    stage: active
    player: active
    conditions: [OPHYDIAN DESTROYERS]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of your Movement phase. Select one OPHYDIAN DESTROYERS unit from your army — remove it from the battlefield and place it into Strategic Reserves. At the end of any of your subsequent Movement phases, set it up anywhere on the battlefield more than 9\" from any enemy models."

  - id: wh40k_9e.necrons.stratagem.prismatic_dimensional_breach
    name_en: Prismatic Dimensional Breach
    cp_cost: 1
    phase: movement
    stage: end
    player: active
    conditions: [CORE]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of your Movement phase. Select one DYNASTY CORE unit that is being held in Reserve and one friendly NIGHT SCYTHE or MONOLITH model on the battlefield — set up the selected unit within 3\" of that model and more than 9\" from any enemy models."

  - id: wh40k_9e.necrons.stratagem.dimensional_destabilisation
    name_en: Dimensional Destabilisation
    cp_cost: 2
    phase: movement
    stage: active
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Movement phase. Select one C'TAN SHARD model from your army — that model can use one additional C'tan Power this phase. If that model is a C'TAN SHARD OF THE VOID DRAGON, this Stratagem costs 1CP instead."

  - id: wh40k_9e.necrons.stratagem.enslaved_protectors
    name_en: Enslaved Protectors
    cp_cost: 1
    phase: movement
    stage: active
    player: inactive
    conditions: [CANOPTEK]
    once_per_phase: true
    rule_text: "Use this Stratagem when an enemy unit ends a Normal Move, Advance, or Falls Back within 3\" of a friendly CANOPTEK unit from your army. That CANOPTEK unit can perform a Heroic Intervention as if it were a CHARACTER."

  # ── Shooting Phase ─────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.techno_oracular_targeting
    name_en: Techno-Oracular Targeting
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem when a NECRONS unit from your army is chosen to shoot. Until the end of the phase, each time a model in that unit makes a ranged attack, if a hit is scored, that attack automatically wounds the target (do not make a wound roll)."

  - id: wh40k_9e.necrons.stratagem.extermination_protocols
    name_en: Extermination Protocols
    cp_cost: 2
    phase: shooting
    stage: active
    player: active
    conditions: [DESTROYER CULT]
    once_per_phase: true
    rule_text: "Use this Stratagem when a LOKHUST DESTROYERS or LOKHUST HEAVY DESTROYERS unit from your army is chosen to shoot. Until the end of the phase, each time a model in that unit makes a ranged attack, you can re-roll the wound roll."

  - id: wh40k_9e.necrons.stratagem.fractal_targeting
    name_en: Fractal Targeting
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [TOMB BLADES]
    once_per_phase: true
    rule_text: "Use this Stratagem when a TOMB BLADES unit from your army is chosen to shoot. Until the end of the phase, Rapid Fire weapons in that unit are treated as Assault weapons, and models in that unit do not suffer the penalty to hit rolls for Advancing and shooting Assault weapons."

  - id: wh40k_9e.necrons.stratagem.disintegration_capacitors
    name_en: Disintegration Capacitors
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem when a NECRONS unit from your army is chosen to shoot. Until the end of the phase, each time a model in that unit makes a ranged attack with a Gauss weapon, an unmodified hit roll of 6 automatically wounds the target."

  - id: wh40k_9e.necrons.stratagem.malevolent_arcing
    name_en: Malevolent Arcing
    cp_cost: 1
    phase: shooting
    stage: end
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem after a NECRONS unit from your army has resolved its attacks with a Tesla weapon. For each enemy unit within 6\" of any model in that unit (other than the target), roll one D6: on a 4+, that unit suffers 1 mortal wound."

  - id: wh40k_9e.necrons.stratagem.relentless_onslaught
    name_en: Relentless Onslaught
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [CORE, INFANTRY]
    once_per_phase: true
    rule_text: "Use this Stratagem when a DYNASTY CORE INFANTRY unit from your army is chosen to shoot. Until the end of the phase, each time a model in that unit makes a ranged attack with a Rapid Fire weapon, an unmodified hit roll of 6 scores 1 additional hit."

  - id: wh40k_9e.necrons.stratagem.reanimation_prioritisation
    name_en: Reanimation Prioritisation
    cp_cost: 2
    phase: shooting
    stage: active
    player: inactive
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem when an enemy unit is chosen to shoot a friendly DYNASTY INFANTRY unit from your army. If you have a friendly REANIMATOR model within 6\" of that INFANTRY unit, you can immediately use that REANIMATOR's Reanimation Beam ability on the targeted unit."

  - id: wh40k_9e.necrons.stratagem.solar_pulse
    name_en: Solar Pulse
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    rule_text: "Use this Stratagem when a NECRONS unit from your army is chosen to shoot. Until the end of the phase, when resolving attacks made by models in that unit, the target does not receive the benefit of cover to its saving throws."

  - id: wh40k_9e.necrons.stratagem.atavistic_instigation
    name_en: Atavistic Instigation
    cp_cost: 1
    phase: shooting
    stage: end
    player: active
    conditions: [DOOM SCYTHE]
    once_per_phase: true
    rule_text: "Use this Stratagem after a DOOM SCYTHE model from your army has resolved its Death Ray attack. Roll one D3 for each enemy unit that was hit by that attack — on a 2+, that unit suffers D3 mortal wounds."

  # ── Charge Phase ───────────────────────────────────────────────────────────

  # (No core charge phase stratagems in main codex beyond Enslaved Protectors above)

  # ── Fight Phase ────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.storm_of_flensing_blades
    name_en: Storm of Flensing Blades
    cp_cost: 2
    phase: fight
    stage: end
    player: active
    conditions: [FLAYED ONES]
    once_per_phase: true
    rule_text: "Use this Stratagem at the end of the Fight phase. Select one FLAYED ONES unit from your army that is within Engagement Range of an enemy unit — that unit can fight again."

  - id: wh40k_9e.necrons.stratagem.judgement_of_the_triarch
    name_en: Judgement of the Triarch
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [TRIARCH]
    once_per_phase: true
    rule_text: "Use this Stratagem when a TRIARCH unit from your army is chosen to shoot or fight. Until the end of the phase, add 1 to hit rolls for attacks made by models in that unit."

  - id: wh40k_9e.necrons.stratagem.eternal_protectors
    name_en: Eternal Protectors
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [LYCHGUARD]
    once_per_phase: true
    rule_text: "Use this Stratagem when a LYCHGUARD unit from your army is chosen to fight, and a friendly NOBLE model is within 3\" of that unit. Until the end of the phase, add 1 to the Attacks characteristic of models in that unit."

  - id: wh40k_9e.necrons.stratagem.disruption_fields
    name_en: Disruption Fields
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [CORE]
    once_per_phase: true
    rule_text: "Use this Stratagem when a NECRONS CORE unit from your army is chosen to fight. Until the end of the phase, add 1 to the Strength characteristic of models in that unit."

  - id: wh40k_9e.necrons.stratagem.whirling_onslaught
    name_en: Whirling Onslaught
    cp_cost: 1
    phase: fight
    stage: active
    player: inactive
    conditions: [DESTROYER CULT]
    once_per_phase: true
    rule_text: "Use this Stratagem when a SKORPEKH DESTROYERS or SKORPEKH LORD unit from your army is chosen to fight. Until the end of the phase, each time an attack is made against that unit, subtract 1 from the wound roll."

  - id: wh40k_9e.necrons.stratagem.entropic_strike
    name_en: Entropic Strike
    cp_cost: 2
    phase: fight
    stage: active
    player: active
    conditions: [C'TAN SHARD]
    once_per_phase: true
    rule_text: "Use this Stratagem when a C'TAN SHARD model from your army is chosen to fight. Until the end of the phase, each time that model makes a melee attack, the target's invulnerable save cannot be used against that attack."

  - id: wh40k_9e.necrons.stratagem.self_destruction
    name_en: Self-Destruction
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [CANOPTEK SCARAB SWARMS]
    once_per_phase: true
    rule_text: "Use this Stratagem when a CANOPTEK SCARAB SWARMS model from your army is within Engagement Range of an enemy unit. Roll one D6: on a 2-5, the closest enemy unit within Engagement Range suffers D3 mortal wounds; on a 6, it suffers 3 mortal wounds. The selected model is then destroyed."

  # ── Any Phase ──────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.resurrection_protocols
    name_en: Resurrection Protocols
    cp_cost: 1
    phase: any
    stage: end
    player: active
    conditions: [INFANTRY]
    once_per_phase: false
    rule_text: "Use this Stratagem at the end of any phase in which a DYNASTY NOBLE or DYNASTY CRYPTEK model from your army was destroyed. Roll one D6: on a 4+, set that model back up on the battlefield as close as possible to where it was destroyed, with D3 wounds remaining."

  - id: wh40k_9e.necrons.stratagem.quantum_deflection
    name_en: Quantum Deflection
    cp_cost: 1
    phase: any
    stage: active
    player: inactive
    conditions: [QUANTUM SHIELDING]
    once_per_phase: true
    rule_text: "Use this Stratagem when a QUANTUM SHIELDING model from your army would lose wounds. Until the end of the phase, that model has a 4+ invulnerable save."

  - id: wh40k_9e.necrons.stratagem.stellar_alignment_protocol
    name_en: Stellar Alignment Protocol
    cp_cost: 2
    phase: command
    stage: active
    player: active
    conditions: [VEHICLE]
    once_per_phase: true
    rule_text: "Use this Stratagem at the start of your Command phase. Select one DYNASTY VEHICLE model from your army that has 10 or more wounds on its profile and has lost any wounds — until the start of your next Command phase, use that model's full characteristics profile regardless of how many wounds it has remaining. If that model has 5 or fewer wounds remaining, this Stratagem costs 1CP instead."

  - id: wh40k_9e.necrons.stratagem.curse_of_the_phaeron
    name_en: Curse of the Phaeron
    cp_cost: 3
    phase: any
    stage: active
    player: active
    conditions: [VEHICLE]
    once_per_phase: false
    rule_text: "Use this Stratagem when a DYNASTY VEHICLE model from your army is destroyed. That model automatically explodes. If that model has 10 or fewer wounds on its profile, this Stratagem costs 1CP instead."

  - id: wh40k_9e.necrons.stratagem.shadows_of_drazak
    name_en: Shadows of Drazak
    cp_cost: 1
    phase: any
    stage: active
    player: inactive
    conditions: [FLAYED ONES]
    once_per_phase: true
    rule_text: "Use this Stratagem when an enemy unit targets a friendly FLAYED ONES unit from your army. Until the end of the phase, subtract 1 from hit rolls for attacks made against that FLAYED ONES unit."

  - id: wh40k_9e.necrons.stratagem.aetheric_interception
    name_en: Aetheric Interception
    cp_cost: 1
    phase: movement
    stage: active
    player: inactive
    conditions: [HYPERSPACE HUNTER]
    once_per_phase: true
    rule_text: "Use this Stratagem when an enemy unit is set up on the battlefield as Reinforcements within 12\" of a friendly HYPERSPACE HUNTER unit from your army. Your HYPERSPACE HUNTER unit can shoot at that enemy unit as if it were your Shooting phase, but only that unit can be targeted."

  - id: wh40k_9e.necrons.stratagem.revenge_of_the_doomstalker
    name_en: Revenge of the Doomstalker
    cp_cost: 2
    phase: any
    stage: active
    player: active
    conditions: [DOOMSTALKER]
    once_per_phase: false
    rule_text: "Use this Stratagem when a friendly CHARACTER model is destroyed. Select one friendly DOOMSTALKER model within 24\" of the destroyed model — that model can immediately shoot one of its ranged weapons as if it were your Shooting phase."

  # ── Dynastic Stratagems ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.stratagem.talent_for_annihilation
    name_en: Talent for Annihilation
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [MEPHRIT]
    once_per_phase: true
    rule_text: "Mephrit only. Use this Stratagem when a MEPHRIT unit from your army is chosen to shoot or fight. Until the end of the phase, each time a model in that unit makes an attack, an unmodified wound roll of 6 inflicts 1 additional mortal wound on the target (max 3 mortal wounds per phase)."

  - id: wh40k_9e.necrons.stratagem.translocation_crypt
    name_en: Translocation Crypt
    cp_cost: 1
    phase: movement
    stage: active
    player: active
    conditions: [NEPHREKH]
    once_per_phase: true
    rule_text: "Nephrekh only. Use this Stratagem at the end of your Movement phase. Select one NEPHREKH INFANTRY unit from your army — that unit gains the Dimensional Translocation ability until the end of the turn."

  - id: wh40k_9e.necrons.stratagem.reclaim_a_lost_empire
    name_en: Reclaim a Lost Empire
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [NIHILAKH]
    once_per_phase: true
    rule_text: "Nihilakh only. Use this Stratagem when a NIHILAKH unit from your army performs an Action. Until the end of the phase, that unit can still shoot even while performing that Action."

  - id: wh40k_9e.necrons.stratagem.blood_rites
    name_en: Blood Rites
    cp_cost: 1
    phase: fight
    stage: active
    player: active
    conditions: [NOVOKH]
    once_per_phase: true
    rule_text: "Novokh only. Use this Stratagem when a NOVOKH unit from your army is chosen to fight. Until the end of the phase, add 1 to the Attacks characteristic of models in that unit."

  - id: wh40k_9e.necrons.stratagem.methodical_destruction
    name_en: Methodical Destruction
    cp_cost: 2
    phase: shooting
    stage: active
    player: active
    conditions: [SAUTEKH]
    once_per_phase: true
    rule_text: "Sautekh only. Use this Stratagem when a SAUTEKH unit from your army is chosen to shoot. Select one enemy unit that unit targets — until the end of the phase, friendly SAUTEKH units add 1 to hit rolls when making attacks against that enemy unit."

  - id: wh40k_9e.necrons.stratagem.empyric_damping
    name_en: Empyric Damping
    cp_cost: 1
    phase: psychic
    stage: active
    player: inactive
    conditions: [SZAREKHAN]
    once_per_phase: true
    rule_text: "Szarekhan only. Use this Stratagem when an enemy PSYKER attempts to manifest a psychic power within 24\" of a friendly SZAREKHAN model. Roll one D6: on a 4+, that psychic power is denied."
