- id: wh40k_9e.necrons.warlord_trait.nephrekh.skin_of_living_gold
  name_en: Skin of Living Gold
  name_de: Haut aus lebendem Gold
  category: dynastic
  dynasty: Nephrekh
  source:
    publication: Codex Necrons
    page: "65"
    capture_status: draft_from_user_image
    image_files:
      - IMG_3885.png
  text_de: >
    Ziehe bei jeder Attacke gegen diesen KRIEGSHERRN 1 vom Trefferwurf ab.
- id: wh40k_9e.necrons.warlord_trait.nihilakh.precognitive_strike
  name_en: Precognitive Strike
  name_de: Voraussehender Schlag
  category: dynastic
  dynasty: Nihilakh
  source:
    publication: Codex Necrons
    page: "65"
    capture_status: draft_from_user_image
    image_files:
      - IMG_3885.png
  text_de: >
    Wenn sich dieser KRIEGSHERR zu Beginn der Nahkampfphase in
    Nahkampfreichweite zu mindestens einer feindlichen Einheit befindet,
    kann er in dieser Phase zuerst kämpfen.
- id: wh40k_9e.necrons.warlord_trait.novokh.blood_fuelled_fury
  name_en: Blood-Fuelled Fury
  name_de: Blutgetriebene Wut
  category: dynastic
  dynasty: Novokh
  source:
    publication: Codex Necrons
    page: "65"
    capture_status: draft_from_user_image
    image_files:
      - IMG_3885.png
  text_de: >
    Bei jeder Nahkampfattacke dieses KRIEGSHERRN verursacht ein
    unmodifizierter Verwundungswurf von 6 beim Ziel zusätzlich zum normalen
    Schaden 1 tödliche Verwundung.
- id: wh40k_9e.necrons.warlord_trait.sautekh.hyperlogical_strategist
  name_en: Hyperlogical Strategist
  name_de: Hyperlogischer Stratege
  category: dynastic
  dynasty: Sautekh
  source:
    publication: Codex Necrons
    page: "65"
    capture_status: draft_from_user_image
    image_files:
      - IMG_3885.png
  text_de: >
    Solange sich dieser KRIEGSHERR auf dem Schlachtfeld befindet, kannst du
    jedes Mal, wenn du einen Befehlspunkt ausgibst, um eine Gefechtsoption
    einzusetzen, einen W6 werfen; bei 5+ erhältst du den Befehlspunkt zurück.
- id: wh40k_9e.necrons.warlord_trait.szarekhan.the_triarchs_will
  name_en: The Triarch's Will
  name_de: Der Wille des Triarchats
  category: dynastic
  dynasty: Szarekhan
  source:
    publication: Codex Necrons
    page: "65"
    capture_status: draft_from_user_image
    image_files:
      - IMG_3885.png
  text_de: >
    Wenn dein KRIEGSHERR diese Begabung des Kriegsherrn hat, kannst du,
    wenn du Kommandoprotokolle für die Schlacht zuweist, vier
    Kommandoprotokolle wählen anstatt fünf, und eines dieser
    Kommandoprotokolle kann zwei Schlachtrunden zugewiesen werden
    anstatt einer.
notes:
- Erste strukturierte Erfassung aus Nutzerbildern.
