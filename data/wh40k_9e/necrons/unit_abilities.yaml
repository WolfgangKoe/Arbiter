  # ── The Silent King ────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.the_silent_king.my_will_be_done
    name_en: My Will Be Done
    badge_label: MWBD
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    extra_uses:
      - has_keyword: PHAERON
        bonus: 1
    rule_text: "In your Command phase, you can select one friendly NECRONS CORE or TRIARCH PRAETORIANS unit within 9\" of Szarekh. Until the start of your next Command phase, each time a model in that unit makes an attack, add 1 to that attack's hit roll. Each unit can only be selected for this ability once per phase. Phaeron: this model can use this ability one additional time per turn."
    trigger:
      timing: phase_any
      phase: command
      stage: active
      player: active
    conditions:
      - has_keywords: [CORE]
        within_inches: 9
    effect:
      type: buff_roll
      target: selected_unit
      stat: hit_roll
      modifier: 1

  - id: wh40k_9e.necrons.unit.the_silent_king.voice_of_the_triarch
    name_en: Voice of the Triarch
    badge_label: VOICE
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "Once per battle, at the start of any battle round, if Szarekh is on the battlefield he can alter your command protocols. One command protocol that was not assigned to any battle round becomes active for that battle round instead of the one assigned to it."
    trigger:
      timing: round_start
      phase: command
      stage: start
      player: active
    conditions: []
    effect:
      type: alter_command_protocol
      target: self
      handler: voiceOfTheTriarch

  - id: wh40k_9e.necrons.unit.the_silent_king.phaeron_of_the_stars
    name_en: Phaeron of the Stars
    badge_label: "PHR★"
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "Aura: while a friendly NECRONS CORE unit or TRIARCH PRAETORIANS unit is within 6\" of Szarekh, each time a ranged attack is made by a model in that unit, you can re-roll the hit roll. Lost when Szarekh has 8 or fewer wounds remaining."
    trigger:
      timing: persistent
      phase: shooting
      stage: active
      player: active
    conditions:
      - has_keywords: [CORE]
        within_inches: 6
    effect:
      type: reroll_hit
      target: friendly_core_aura_6

  - id: wh40k_9e.necrons.unit.the_silent_king.phaeron_of_the_blades
    name_en: Phaeron of the Blades
    badge_label: "PHR⚔"
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "Aura: while a friendly NECRONS CORE unit or TRIARCH PRAETORIANS unit is within 6\" of Szarekh, each time a melee attack is made by a model in that unit, you can re-roll the wound roll. Lost when Szarekh has 4 or fewer wounds remaining."
    trigger:
      timing: persistent
      phase: fight
      stage: active
      player: active
    conditions:
      - has_keywords: [CORE]
        within_inches: 6
    effect:
      type: reroll_wound
      target: friendly_core_aura_6

  - id: wh40k_9e.necrons.unit.the_silent_king.relentless_march
    name_en: Relentless March
    badge_label: MARCH
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "Aura: while a friendly NECRONS CORE or TRIARCH PRAETORIANS unit is within 6\" of Szarekh, each time that unit is selected to make a Normal Move or Advance, add 1\" to the Move characteristic of models in that unit until the end of the phase."
    trigger:
      timing: persistent
      phase: movement
      stage: active
      player: active
    conditions:
      - has_keywords: [CORE]
        within_inches: 6
    effect:
      type: buff_stat
      target: friendly_core_aura
      stat: move
      modifier: 1

  - id: wh40k_9e.necrons.unit.the_silent_king.noctilith_beacons
    name_en: Noctilith Beacons
    badge_label: NOCTI
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "In your opponent's Psychic phase, Szarekh can attempt to deny one psychic power as if he were a PSYKER."
    trigger:
      timing: phase_reactive
      phase: psychic
      stage: active
      player: inactive
      event: opponent_psychic_phase
    conditions: []
    effect:
      type: deny_psychic
      target: self

  - id: wh40k_9e.necrons.unit.the_silent_king.obeisance_generators
    name_en: Obeisance Generators
    badge_label: OBEIS
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "At the start of the Fight phase, if there are any enemy units within Engagement Range of Szarekh, those units cannot fight until after all other eligible units from your army have done so."
    trigger:
      timing: phase_start
      phase: fight
      stage: start
      player: active
    conditions:
      - enemy_in_engagement_range: true
    effect:
      type: fight_last
      target: enemy_in_engagement_range

  - id: wh40k_9e.necrons.unit.the_silent_king.vengeance_of_the_enchained
    name_en: Vengeance of the Enchained
    badge_label: VENG
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.the_silent_king
    rule_text: "When Szarekh is destroyed, roll one D6 before removing it from play. On a 4+, each unit within 2D6\" suffers D6 mortal wounds."
    trigger:
      timing: phase_reactive
      phase: any
      stage: active
      player: either
      event: model_destroyed
    conditions:
      - has_rules: [vengeanceOfTheEnchained]
    effect:
      type: mortal_wounds
      target: units_within_2d6
      amount: "D6"
      roll_threshold: 4

  # ── Troops ────────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.warriors.their_number_is_legion
    name_en: Their Number is Legion
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.warriors
    rule_text: "Each time a Reanimation Protocols roll is made for this unit, re-roll unmodified results of 1."
    trigger:
      timing: phase_reactive
      phase:
        - shooting
        - fight
      stage: end
      player: inactive
      event: reanimation_roll
    conditions:
      - has_rules: [theirNumberIsLegion]
    effect:
      type: reroll_rp
      target: self
      modifier: 1

  # ── Elites ────────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.deathmarks.hyperspace_hunter
    name_en: Hyperspace Hunter
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.deathmarks
    rule_text: "During deployment, this unit can be set up in hyperspace instead of being set up on the battlefield. At the end of any of your Movement phases, this unit can arrive — set it up anywhere on the battlefield more than 9\" from any enemy models."
    trigger:
      timing: persistent
      phase: deployment
      stage: active
      player: active
    conditions:
      - has_rules: [hyperspaceHunter]
    effect:
      type: deep_strike
      target: self

  # ── Canoptek Plasmacyte ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.canoptek_plasmacyte.viral_construct
    name_en: Viral Construct
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.canoptek_plasmacyte
    rule_text: "Once per battle, at the start of any Fight phase, if this model is within 1\" of a friendly SKORPEKH DESTROYERS or OPHYDIAN DESTROYERS unit, you can select that unit. Until the end of the phase, each time a model in that unit makes an attack, add 1 to the Strength and Attacks characteristics of that attack."
    trigger:
      timing: phase_start
      phase: fight
      stage: start
      player: active
    conditions:
      - has_rules: [viralConstruct]
        within_inches: 1
    effect:
      type: buff_stat
      target: selected_unit
      stat: [strength, attacks]
      modifier: 1

  - id: wh40k_9e.necrons.unit.canoptek_plasmacyte.evasion_protocol
    name_en: Evasion Protocol
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.canoptek_plasmacyte
    rule_text: "This model has a 5+ invulnerable save."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [evasionProtocol]
    effect:
      type: invuln_save
      target: self
      value: 5

  - id: wh40k_9e.necrons.unit.canoptek_plasmacyte.infused_madness
    name_en: Infused Madness
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.canoptek_plasmacyte
    rule_text: "Each time this model is destroyed, roll one D6: on a 4+, the closest enemy unit within 6\" suffers 1 mortal wound."
    trigger:
      timing: phase_reactive
      phase: any
      stage: active
      player: either
      event: model_destroyed
    conditions:
      - has_rules: [infusedMadness]
    effect:
      type: mortal_wounds
      target: closest_enemy_within_6
      amount: 1
      roll_threshold: 4

  # ── Hexmark Destroyer ─────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.hexmark_destroyer.inescapable_death
    name_en: Inescapable Death
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.hexmark_destroyer
    rule_text: "Each time an enemy unit Falls Back within 9\" of this model, this model can make a ranged attack against that unit."
    trigger:
      timing: phase_reactive
      phase: movement
      stage: active
      player: inactive
      event: enemy_falls_back
    conditions:
      - has_rules: [inescapableDeath]
        within_inches: 9
    effect:
      type: free_attack
      target: falling_back_unit
      handler: inescapableDeath

  - id: wh40k_9e.necrons.unit.hexmark_destroyer.multi_threat_eliminator
    name_en: Multi-threat Eliminator
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.hexmark_destroyer
    rule_text: "Each time this model makes a ranged attack, re-roll a hit roll of 1. If the target is a CHARACTER, re-roll all failed hit rolls instead."
    trigger:
      timing: persistent
      phase: shooting
      stage: active
      player: active
    conditions:
      - has_rules: [multiThreatEliminator]
    effect:
      type: reroll_hits
      target: self
      reroll: 1
      bonus_vs_character: reroll_all_failed

  # ── Transcendent C'tan ────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.transcendent_ctan.enslaved_star_god
    name_en: Enslaved Star God
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.transcendent_ctan
    rule_text: "Friendly NECRONS units (other than C'TAN SHARDS) automatically pass Morale tests while they are within 12\" of any friendly C'TAN SHARD models."
    trigger:
      timing: persistent
      phase: morale
      stage: active
      player: active
    conditions:
      - has_rules: [enslavedStarGod]
        within_inches: 12
    effect:
      type: auto_pass_morale
      target: friendly_non_ctan

  - id: wh40k_9e.necrons.unit.transcendent_ctan.reality_unravels
    name_en: Reality Unravels
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.transcendent_ctan
    rule_text: "At the start of each battle round, you can roll one D6; on a 4+, pick one enemy unit. That unit suffers D3 mortal wounds."
    trigger:
      timing: round_start
      phase: any
      stage: start
      player: active
    conditions:
      - has_rules: [realityUnravels]
    effect:
      type: mortal_wounds
      target: selected_enemy
      amount: "D3"
      roll_threshold: 4

  - id: wh40k_9e.necrons.unit.transcendent_ctan.fractured_personality
    name_en: Fractured Personality
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.transcendent_ctan
    rule_text: "At the start of the battle, before deployment, randomly select one of the C'tan Powers this model knows. It can use that power twice per battle instead of once."
    trigger:
      timing: pre_battle
      phase: any
      stage: start
      player: active
    conditions:
      - has_rules: [fracturedPersonality]
    effect:
      type: double_use_power
      target: self
      handler: fracturedPersonality

  # ── Obelisk ───────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.obelisk.hovering_sentinel
    name_en: Hovering Sentinel
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.obelisk
    rule_text: "At the end of your Movement phase, if this model did not move this turn, until the start of your next Movement phase, this model is considered to not have FLY for the purposes of charging and being charged."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_rules: [hoveringSentinel]
        did_not_move: true
    effect:
      type: toggle_keyword
      target: self
      keyword: FLY
      remove: true

  - id: wh40k_9e.necrons.unit.obelisk.gravity_pulse
    name_en: Gravity Pulse
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.obelisk
    rule_text: "Once per battle, at the start of your Shooting phase, select one enemy unit within 24\" of this model. Until the start of your next turn, subtract 2 from any Advance and Charge rolls made for that unit."
    trigger:
      timing: phase_start
      phase: shooting
      stage: start
      player: active
    conditions:
      - has_rules: [gravityPulse]
        within_inches: 24
    effect:
      type: debuff_roll
      target: selected_enemy
      stat: [advance_roll, charge_roll]
      modifier: -2

  # ── Convergence of Dominion ────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.convergence_of_dominion.dominion_protocols
    name_en: Dominion Protocols
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.convergence_of_dominion
    rule_text: "Each time a model in a friendly DYNASTY unit within 6\" of any STARSTELE models from your army would lose a wound, roll one D6: on a 6, that wound is not lost."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [dominionProtocols]
        within_inches: 6
    effect:
      type: fnp
      target: friendly_dynasty_units
      value: 6

  - id: wh40k_9e.necrons.unit.convergence_of_dominion.dynastic_command_node
    name_en: Dynastic Command Node
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.convergence_of_dominion
    rule_text: "While a friendly DYNASTY INFANTRY unit is within 6\" of any STARSTELE models from your army, models in that unit can use the Command phase ability of their unit even if that ability has already been used this turn."
    trigger:
      timing: persistent
      phase: command
      stage: active
      player: active
    conditions:
      - has_rules: [dynasticCommandNode]
        within_inches: 6
    effect:
      type: allow_repeat_ability
      target: friendly_infantry_within_6
      handler: dynasticCommandNode

  - id: wh40k_9e.necrons.unit.convergence_of_dominion.translocation_protocols
    name_en: Translocation Protocols
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.convergence_of_dominion
    rule_text: "At the end of your Movement phase, you can select one STARSTELE model from your army that did not move this turn. Remove that model from the battlefield, then set it up anywhere on the battlefield that is more than 3\" from any enemy models."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_rules: [translocationProtocols]
        did_not_move: true
    effect:
      type: teleport
      target: self_model
      restriction: more_than_3_from_enemy

