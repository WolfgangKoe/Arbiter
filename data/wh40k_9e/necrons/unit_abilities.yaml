    unit_id: wh40k_9e.necrons.unit.orikan_the_diviner
    rule_text: "In your Command phase, you can select one friendly NECRONS unit within 9\". Until the start of your next Command phase, you can reroll charge rolls made for that unit and models in that unit have a 5+ invulnerable save."
