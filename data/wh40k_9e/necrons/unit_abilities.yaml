    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.orikan_the_diviner
    rule_text: "In your Command phase, if this model is on the battlefield, roll one D6: if the result is less than the current battle round number, until the end of the battle use the Orikan Empowered profile (WS:2+, S:5, W:7, A:4)."
    trigger:
      timing: phase_any
      phase: command
      stage: active
      player: active
    conditions: []
