    unit_id: wh40k_9e.necrons.unit.technomancer
    rule_text: "Each DYNASTY Detachment can only be joined by one CRYPTEK (unless a special rule allows otherwise)."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [dynasticAdvisors]
    effect:
      type: restriction
      target: detachment
      handler: dynasticAdvisors

  - id: wh40k_9e.necrons.unit.technomancer.rites_of_reanimation
    name_en: Rites of Reanimation
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.technomancer
    rule_text: "Once per phase, at the end of the phase, select one friendly DYNASTY INFANTRY unit within 3\" of this model. That unit immediately makes Reanimation Protocol rolls."
    trigger:
      timing: phase_end
      phase:
