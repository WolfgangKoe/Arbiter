faction: Necrons
abilities:
  - id: necrons.unit.overlord.my_will_be_done
    name_en: My Will Be Done
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.overlord
    rule_text: "In your Command phase, select one friendly DYNASTY CORE unit within 9\".
      Until the start of your next Command phase, each time a model in that unit makes
      an attack, add 1 to that attack's hit roll."
    trigger:
      timing: phase_any
      phase: command
      player: active
    conditions:
      - has_keywords: [Core]
        within_inches: 9
    effect:
      type: buff_roll
      target: selected_unit
      stat: hit_roll
      modifier: 1

  - id: necrons.unit.overlord.resurrection_orb
    name_en: Resurrection Orb
    source: wargear
    unit_id: wh40k_9e.necrons.unit.overlord
    rule_text: "Once per battle, in your Command phase, select one friendly DYNASTY unit
      within 6\" not at Starting Strength. That unit's reanimation protocols are enacted."
    trigger:
      timing: phase_any
      phase: command
      player: active
    conditions:
      - within_inches: 6
        max_uses: 1
    effect:
      type: complex
      target: selected_unit
      handler: resurrectionOrb
