faction: Necrons
abilities:

  # ── HQ ────────────────────────────────────────────────────────────────────

  - id: wh40k_9e.necrons.unit.overlord.my_will_be_done
    name_en: My Will Be Done
    badge_label: MWBD
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.necrons.unit.overlord
    extra_uses:
      - has_keyword: PHAERON
        bonus: 1
    rule_text: "In your Command phase, select one friendly DYNASTY CORE unit within 9\". Until the start of your next Command phase, each time a model in that unit makes an attack, add 1 to that attack's hit roll."
