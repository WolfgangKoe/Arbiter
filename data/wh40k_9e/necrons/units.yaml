# Format: army_builder.md v1 (see docs/spec/army_builder.md)
#
# Stats: base codex values (no dynasty bonuses).
# invuln_save: only from unit-intrinsic abilities (e.g. Quantum Shielding).
#   Dynasty 6+ invulns (e.g. Nephrekh) are applied by subfaction_abilities.yaml.
# weapons: refs to weapons.yaml — resolved by loader (Ziel 5c).
# models_min/max: codex unit composition limits.
# attacks: A-characteristic (base value, before modifiers).

