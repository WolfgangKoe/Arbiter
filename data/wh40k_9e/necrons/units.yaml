  model_groups:
  - id: lychguard
    name_en: Lychguard
    count: models_max
    weapons:
    - ref: wh40k_9e.necrons.weapon.warscythe
    weapon_swaps:
    # ALL models swap together (datasheet: "All of the models in the unit can
    # have their warscythe replaced with 1 hyperphase sword and 1 dispersion
    # shield each") — all-or-nothing, no mixed loadout. The dispersion shield
    # is wargear (wh40k_9e.necrons.wargear.dispersion_shield), added via the
    # roster wargear list — the swap only changes the weapon.
    - id: sword_and_shield
      scope: group
      replaces:
      - wh40k_9e.necrons.weapon.warscythe
      options:
      - wh40k_9e.necrons.weapon.hyperphase_sword
    priority: 1
