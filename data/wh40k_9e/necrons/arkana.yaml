schema: tabletop.cryptek_arkana.v1
game_system: wh40k_9e
faction: Necrons
entries:
  - id: wh40k_9e.necrons.arkana.failsafe_overcharger
    name_en: Failsafe Overcharger
    name_de: Sicherungsüberlader
    power_delta: 2
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Indem er die Überschreibungsprotokolle in seinem Stab auslöst, kann der
      Träger die Schutzsicherungen in nahen Kanoptech-Konstrukten aktivieren.
      Da sie glauben, das zentrale Sicherungsprogramm ihrer Gruftwelt würde
      direkt angegriffen, mobilisieren die Konstrukte verborgene
      Energievorräte und treten in einen wilden Zustand aggressiver
      Übersteuerung ein.
      Nur für ein TECHNOMANT-Modell. In deiner Befehlsphase kannst du eine
      befreundete KANOPTECH-Einheit innerhalb von 9 Zoll um den Träger
      auswählen. Addiere bis zum Beginn deiner nächsten Befehlsphase 1 zum
      Attackenwert der Modelle der gewählten Einheit. Wenn die Einheit eine
      MONSTER- oder FAHRZEUG-Einheit ist, addiere W3 zum Attackenwert der
      Modelle statt 1.
  - id: wh40k_9e.necrons.arkana.countertemporal_nanomines
    name_en: Countertemporal Nanomines
    name_de: Antitemporale Nanominen
    power_delta: 2
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Ein Schwarm Nanoskarabäen, der aus einem Schwarmjuwel über der Person des
      Trägers freigesetzt wurde, schwärmt aus und versetzt den Boden vor sich
      mit mikroskopischen temporalen Ladungen. Feinde, die in dieses
      unsichtbare Minenfeld vorrücken, stellen fest, dass die Realität um sie
      herum ruckelt und verzögert, während sie eine winzige Chronoverwerfung
      nach der anderen auslösen.
      Nur für ein CHRONOMANT-Modell. In deiner Fernkampfphase kannst du eine
      feindliche Einheit innerhalb von 18 Zoll um den Träger auswählen.
      Halbiere bis zum Beginn deines nächsten Zuges jeden Vorrücken- und
      Angriffswurf für die gewählte Einheit.
  - id: wh40k_9e.necrons.arkana.atavindicator
    name_en: Atavindicator
    name_de: Atavindicator
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieses grausame Gerät, das psychointerrogative transoptische Projektoren
      verwendet, holt die primitivsten Ängste des Ziels aus seinem Geist und
      projiziert sie in einem befremdlichen Angriff auf sein Sichtfeld. Mit
      schrecklichen Visionen ihres eigenen nahenden Todes bombardiert,
      schädigen sich Feinde wahrscheinlich selbst bei dem Versuch, ihrem
      halluzinatorischen Schicksal zu entkommen, oder leiden ansonsten unter
      den lähmenden psychologischen und physischen Nebeneffekten ihres elenden
      Angstzustands.
      Nur für ein PSYCHOMANT-Modell. Wähle am Ende deiner Bewegungsphase eine
      feindliche Einheit (ausgenommen FAHRZEUG-Einheiten) innerhalb von
      18 Zoll um den Träger und wirf 3W6; wenn die Summe dem Moralwert der
      gewählten Einheit entspricht oder höher ist, erleidet die feindliche
      Einheit W3 tödliche Verwundungen.
  - id: wh40k_9e.necrons.arkana.dimensional_sanctum
    name_en: Dimensional Sanctum
    name_de: Dimensionszuflucht
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieser Kryptomant hat sich eine persönliche Taschendimension geschaffen,
      aus der er nach Belieben in die Schlacht treten kann.
      Der Träger erhält die Fähigkeit Dimensionale Translokation
      (Seite 80).
  - id: wh40k_9e.necrons.arkana.hypermaterial_ablator
    name_en: Hypermaterial Ablator
    name_de: Hypermaterial-Abtrager
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Indem er mit seinem schlanken Quasiniumstab auf etwas zeigt, verhüllt
      der Träger seine als Ziel gewählten Verbündeten in einem wirbelnden Feld
      angesammelter Hypermaterie.
      In deiner Befehlsphase kannst du eine befreundete
      <DYNASTIE>-KERN- oder <DYNASTIE>-KANOPTECH-Einheit innerhalb von
      9 Zoll um den Träger auswählen. Bis zum Beginn deiner nächsten
      Befehlsphase wird die gewählte Einheit bei jeder Fernkampfattacke gegen
      sich behandelt, als profitiere sie von leichter Deckung (siehe
      Warhammer-40.000-Regelbuch), sofern der Attackierende weiter als
      12 Zoll von ihr entfernt ist.
  - id: wh40k_9e.necrons.arkana.cortical_subjugator_scarabs
    name_en: Cortical Subjugator Scarabs
    name_de: Kortikale Unterwerfungsskarabäen
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieser paranoide und ichbesessene Kryptomant sorgte dafür, dass wichtige
      Untergebene mit einer spezialisierten Variante der
      Gedankenkontrollskarabäen infiziert wurden - natürlich ohne ihr Wissen.
      Bei einem Notfall kann der von den Parasiten befallene Lakai aktiviert
      werden und seine Gedankenmuster werden von dem eigenartigen und
      überwältigenden Verlangen überschrieben, in die Schlacht zu stürmen und
      seinen Meister um jeden Preis zu beschützen.
      Einmal pro Schlacht kannst du zu Beginn des Schritts Heroische
      Interventionen in der Angriffsphase deines Gegners eine befreundete
      <DYNASTIE>-Einheit innerhalb von 6 Zoll um den Träger auswählen. Sofern
      sich die Einheit nicht in Nahkampfreichweite einer feindlichen Einheit
      befindet, kann sie wie ein CHARAKTERMODELL eine Heroische Intervention
      durchführen.
  - id: wh40k_9e.necrons.arkana.cryptogeometric_adjuster
    name_en: Cryptogeometric Adjuster
    name_de: Kryptogeometrischer Regler
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieses bösartige Gerät, das dafür eingerichtet ist, Schwindel erregende
      Reaktionen im sensorischen Apparat von Nicht-Necron-Lebensformen
      hervorzurufen, sorgt dafür, dass nahe Feinde wild und unpräzise
      schießen, da sich ihre Wahrnehmung von Raum und Zeit in einem
      verwirrenden Rausch verzerrt.
      Zu Beginn der Fernkampfphase deines Gegners kannst du eine feindliche
      Einheit auswählen, die sich innerhalb von 12 Zoll befindet und für den
      Träger sichtbar ist. Ziehe bis zum Ende der Phase bei jeder Attacke
      eines Modells der gewählten Einheit 1 vom Trefferwurf ab.
  - id: wh40k_9e.necrons.arkana.metalodermal_tesla_weave
    name_en: Metalodermal Tesla Weave
    name_de: Metallodermales Tesla-Gewebe
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieses Mikrosilikatgewebe erzeugt eine zyklische elektrostatische
      Überladung, die, wenn der Träger sie rechtzeitig auslöst, zuckende
      Blitze überspringen lässt und heranstürmende Angreifer röstet.
      Am Ende des Schritts Angriffe in der Angriffsphase deines Gegners kannst
      du eine feindliche Einheit auswählen, die in dieser Phase eine
      Angriffsbewegung innerhalb von 6 Zoll um den Träger beendet hat. Wirf
      einen W6; bei 2+ erleidet die feindliche Einheit W3 tödliche
      Verwundungen.
  - id: wh40k_9e.necrons.arkana.photonic_transubjector
    name_en: Photonic Transubjector
    name_de: Photonischer Transpersonalisator
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Dieses Gerät erschafft temporäre Hologrammabbilder seines Trägers aus
      grellem Licht, um Angreifer und Meuchelmörder zu verwirren.
      Einmal pro Zug, wenn das erste Mal ein Schutzwurf für den Träger
      misslingt, wird der Schadenswert der Attacke zu 0 geändert.
  - id: wh40k_9e.necrons.arkana.phylacterine_hive
    name_en: Phylacterine Hive
    name_de: Phylakterienschwarm
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Eingeschlossen in einem stabilisierenden Fluxfeld in dieser kleinen
      Glimmerstahlkugel befindet sich ein Schwarm besonders mächtiger, wenn
      auch kurzlebiger Nanoskarabäen. Indem das Feld deaktiviert und dann der
      Schwarm mitten unter eine befreundete Necron-Einheit geschleudert wird,
      können diese schnell ausbrennenden Reparaturdrohnen entfesselt werden,
      um die physische Gestalt sogar der komplexesten und ungewöhnlichsten
      Androidensoldaten zu reparieren.
      Nur für ein TECHNOMANT-Modell. Einmal pro Schlacht kannst du, wenn der
      Träger seine Fähigkeit Riten der Reanimation einsetzt, eine
      befreundete <DYNASTIE>-KANOPTECH-, <DYNASTIE>-DESTRUKTORKULT- oder
      TRIARCHAT-PRÄTORIANER-Einheit auswählen, die statt einer befreundeten
      <DYNASTIE>-KERN-Einheit von der Fähigkeit betroffen wird.
  - id: wh40k_9e.necrons.arkana.prismatic_obfuscatron
    name_en: Prismatic Obfuscatron
    name_de: Prismatischer Obfuskierer
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Der Träger dieses schimmernden zwischenräumlichen Juwels wird von einem
      multispektralen Leuchten umgeben, das für organische Sicht derart
      verwirrend und für künstliche Sinne so befremdlich ist, dass er
      lediglich als flammender Stern erscheint. Auch nur einen Blick auf ihn
      zu erhaschen, ist äußerst schwierig, ihn zu beschießen schier
      unmöglich. Erst wenn er sich nähert, verblasst der kosmische Schein und
      der Träger klärt sich zu seiner wahren Gestalt auf.
      Solange der Träger nicht das nächste infrage kommende Ziel ist, können
      feindliche Modelle ihn nicht als Ziel für Fernkampfattacken auswählen.
  - id: wh40k_9e.necrons.arkana.quantum_orb
    name_en: Quantum Orb
    name_de: Quantensphäre
    power_delta: 1
    source:
      publication: Codex Necrons
      page: "61"
      capture_status: draft_from_user_image
      image_files:
        - IMG_3881.png
        - IMG_3882.png
    applies_to:
      keywords:
        - CRYPTEK
    text_de: >
      Diese glatte und strukturlose Kugel wird durch das Drücken einer Reihe
      verborgener Knöpfe auf ihrer Oberfläche in einer bestimmten Reihenfolge
      aktiviert. Dies löst die Schutzfelder in ihr nacheinander auf. Wenn das
      letzte aufgelöst ist, löscht sich das Gerät zusammen mit allen in seiner
      Nähe durch eine kollabierende Quantensingularität aus.
      Nur für ein PLASMANT-Modell. Einmal pro Schlacht kann der Träger in
      deiner Befehlsphase diesen Gegenstand der Kryptomanten-Arkana
      aktivieren. Wenn er dies tut, wähle einen beliebigen Punkt auf dem
      Schlachtfeld innerhalb von 24 Zoll um den Träger und lege einen Marker
      auf den Punkt. Wirf zu Beginn deiner nächsten Befehlsphase einen W6 für
      jede Einheit innerhalb von 6 Zoll um den Mittelpunkt des Markers und
      ziehe 1 ab, wenn die Einheit, für die gewürfelt wird, ein
      CHARAKTERMODELL ist. Bei 4-5 erleidet die Einheit W3 tödliche
      Verwundungen und bei einer 6 erleidet die Einheit 3 tödliche
      Verwundungen. Dann wird der Marker entfernt.
notes:
  - Erste strukturierte Erfassung aus Nutzerbildern.
  - Verbleibende Unsicherheiten wurden nur dort belassen, wo die Bildstelle
    abgeschnitten oder verdeckt war.
