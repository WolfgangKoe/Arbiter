faction: Necrons
subfactions:
  - id: nephrekh
    name_en: Nephrekh
    abilities:
      - id: necrons.dynasty.nephrekh.translocation_beams
        name_en: Translocation Beams
        ability_type: triggered
        source: dynastic_code
        rule_text: "Models in this unit have a 6+ invulnerable save."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions: []
        effect:
          type: invuln_save
          target: self
          modifier: 6

  - id: mephrit
    name_en: Mephrit
    abilities:
      - id: necrons.dynasty.mephrit.talent_for_annihilation
        name_en: Talent for Annihilation
        ability_type: triggered
        source: dynastic_code
        rule_text: "Each time a model in this unit makes a ranged attack that targets an enemy unit within half of the attacking weapon's maximum range, improve the AP characteristic of that attack by 1."
        trigger:
          timing: persistent
          phase: shooting
          stage: active
          player: active
        conditions: []
        effect:
          type: buff_ap
          target: self
          modifier: 1

  - id: nihilakh
    name_en: Nihilakh
    abilities:
      - id: necrons.dynasty.nihilakh.acquisitive_grasp
        name_en: Acquisitive Grasp
        ability_type: triggered
        source: dynastic_code
        rule_text: "While this unit is within range of an objective marker that you control, models in this unit cannot Fall Back."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions:
          - has_rules: [nihilakhAcquisitiveGrasp]
        effect:
          type: restriction
          target: self
          handler: nihilakhFallBack

  - id: novokh
    name_en: Novokh
    abilities:
      - id: necrons.dynasty.novokh.savage_hunters
        name_en: Savage Hunters
        ability_type: triggered
        source: dynastic_code
        rule_text: "Add 1 to charge rolls made for this unit. In addition, each time a model in this unit makes a melee attack, if the attacking unit made a charge move, was charged, or performed a Heroic Intervention this turn, add 1 to that attack's hit roll."
        trigger:
          timing: persistent
          phase: fight
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: novokhSavageHunters

  - id: sautekh
    name_en: Sautekh
    abilities:
      - id: necrons.dynasty.sautekh.relentless_expansionists
        name_en: Relentless Expansionists
        ability_type: triggered
        source: dynastic_code
        rule_text: "Add 3\" to Advance rolls made for this unit. In addition, each time a model in this unit makes a ranged attack, if this unit Advanced this turn, treat Assault weapons as stationary for the purposes of hit roll penalties."
        trigger:
          timing: persistent
          phase: movement
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: sautekh_advance

  - id: szarekhan
    name_en: Szarekhan
    # Dynastic Code = Uncanny Artificers (Wahapedia 9E). NOTE: the Silent King has
    # the DYNASTIC AGENT keyword and therefore does NOT receive this code (FAQ).
    # The earlier "Loyal to the Triarch / both directives" entry was incorrect —
    # "both directives" is a different dynasty's code + a relic/aura, not Szarekhan.
    abilities:
      - id: necrons.dynasty.szarekhan.uncanny_artificers_resilient
        name_en: Uncanny Artificers
        ability_type: triggered
        source: dynastic_code
        rule_text: "Each time a model with this code would lose a wound as the result of a mortal wound, roll one D6; on a 5+ that wound is not lost."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions: []
        effect:
          type: complex
          target: self
          handler: uncannyArtificersMortal
      - id: necrons.dynasty.szarekhan.uncanny_artificers_lethal
        name_en: Uncanny Artificers
        ability_type: triggered
        source: dynastic_code
        rule_text: "Each time a unit with this code is selected to shoot or fight, you can re-roll one wound roll."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: uncannyArtificersReroll

  # ── Supplement Subfactions (Keyword-gated, not Dynasty) ───────────────────

  - id: destroyer_cult
    name_en: Destroyer Cult
    abilities:
      - id: wh40k_9e.necrons.subfaction.destroyer_cult.hardwired_for_destruction
        name_en: Hardwired for Destruction
        ability_type: triggered
        source: subfaction_rule
        rule_text: "Each time a model in this unit makes an attack, re-roll a hit roll of 1."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: active
        conditions:
          - has_rules: [hardwiredForDestruction]
        effect:
          type: reroll_hit
          target: self
          modifier: 1
