faction: Necrons
subfactions:
  - id: nephrekh
    name_en: Nephrekh
    abilities:
      - id: necrons.dynasty.nephrekh.translocation_beams
        name_en: Translocation Beams
        ability_type: triggered
        source: dynastic_code
        rule_text: "Models in this unit have a 6+ invulnerable save."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions: []
        effect:
          type: invuln_save
          target: self
          modifier: 6

  - id: mephrit
    name_en: Mephrit
    abilities:
      - id: necrons.dynasty.mephrit.solar_fury
        name_en: Solar Fury
        ability_type: triggered
        source: dynastic_code
        rule_text: "Add 3\" to the Range characteristic of ranged weapons (excluding Pistols) that models with this code are equipped with. Each time a model with this code makes a ranged attack that targets a unit within half range, the Armour Penetration characteristic of that attack is improved by 1."
        trigger:
          timing: persistent
          phase: shooting
          stage: active
          player: active
        conditions: []
        effect:
          type: multi
          effects:
            - type: range_bonus
              target: self
              value: 3
              excludes_keyword: PISTOL
            - type: buff_ap
              target: self
              modifier: 1
              condition: target_within_half_range

  - id: nihilakh
    name_en: Nihilakh
    abilities:
      - id: necrons.dynasty.nihilakh.aggressively_territorial
        name_en: Aggressively Territorial
        ability_type: triggered
        source: dynastic_code
        rule_text: "Units with this code have the Objective Secured ability. If a model in such a unit already has this ability, that model counts as one additional model when determining control of an objective marker. Each time an attack with an Armour Penetration characteristic of -1 is allocated to a model with this code, if that model's unit is wholly within its controller's deployment zone, that attack has an Armour Penetration characteristic of 0 instead."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions: []
        effect:
          type: multi
          effects:
            - type: objective_secured
              target: self
            - type: ap_override_if_neg1
              target: self
              to: 0
              condition: wholly_within_own_deployment_zone

  - id: novokh
    name_en: Novokh
    abilities:
      - id: necrons.dynasty.novokh.savage_hunters
        name_en: Savage Hunters
        ability_type: triggered
        source: dynastic_code
        rule_text: "Add 1 to charge rolls made for this unit. In addition, each time a model in this unit makes a melee attack, if the attacking unit made a charge move, was charged, or performed a Heroic Intervention this turn, add 1 to that attack's hit roll."
        trigger:
          timing: persistent
          phase: fight
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: novokhSavageHunters

  - id: sautekh
    name_en: Sautekh
    abilities:
      - id: necrons.dynasty.sautekh.relentless_expansionists
        name_en: Relentless Expansionists
        ability_type: triggered
        source: dynastic_code
        rule_text: "Add 3\" to Advance rolls made for this unit. In addition, each time a model in this unit makes a ranged attack, if this unit Advanced this turn, treat Assault weapons as stationary for the purposes of hit roll penalties."
        trigger:
          timing: persistent
          phase: movement
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: sautekh_advance

  - id: szarekhan
    name_en: Szarekhan
    # Dynastic Code = Uncanny Artificers (Wahapedia 9E). NOTE: the Silent King has
    # the DYNASTIC AGENT keyword and therefore does NOT receive this code (FAQ).
    # The earlier "Loyal to the Triarch / both directives" entry was incorrect —
    # "both directives" is a different dynasty's code + a relic/aura, not Szarekhan.
    abilities:
      - id: necrons.dynasty.szarekhan.uncanny_artificers_resilient
        name_en: Uncanny Artificers
        ability_type: triggered
        source: dynastic_code
        rule_text: "Each time a model with this code would lose a wound as the result of a mortal wound, roll one D6; on a 5+ that wound is not lost."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: either
        conditions: []
        effect:
          type: complex
          target: self
          handler: uncannyArtificersMortal
      - id: necrons.dynasty.szarekhan.uncanny_artificers_lethal
        name_en: Uncanny Artificers
        ability_type: triggered
        source: dynastic_code
        rule_text: "Each time a unit with this code is selected to shoot or fight, you can re-roll one wound roll."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: active
        conditions: []
        effect:
          type: complex
          target: self
          handler: uncannyArtificersReroll

  # ── Supplement Subfactions (Keyword-gated, not Dynasty) ───────────────────

  - id: destroyer_cult
    name_en: Destroyer Cult
    abilities:
      - id: wh40k_9e.necrons.subfaction.destroyer_cult.hardwired_for_destruction
        name_en: Hardwired for Destruction
        ability_type: triggered
        source: subfaction_rule
        rule_text: "Each time a model in this unit makes an attack, re-roll a hit roll of 1."
        trigger:
          timing: persistent
          phase: any
          stage: active
          player: active
        conditions:
          - has_rules: [hardwiredForDestruction]
        effect:
          type: reroll_hit
          target: self
          modifier: 1
