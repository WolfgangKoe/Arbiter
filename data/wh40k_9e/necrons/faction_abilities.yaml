faction: Necrons
# Generic subfaction binding (see armyCard subfaction badge): which roster field
# carries this faction's subfaction choice, and how to label it in the UI.
subfaction_field: dynasty
subfaction_label: Dynasty
round_choice_label: Command Protocols
abilities:
- id: wh40k_9e.necrons.faction.living_metal
  name_en: Living Metal
  ability_type: triggered
  source: faction_rule
  rule_text: At the start of your Command phase, each model in this unit regains 1 lost wound.
  trigger:
    timing: phase_start
    phase: command
    stage: start
    player: active
  conditions:
  - has_rules:
    - livingMetal
    unit_not_destroyed: true
    needs_healing: true
  effect:
    type: heal
    target: self
    amount: '1'
    revive: false
- id: wh40k_9e.necrons.faction.reanimation_protocols
  name_en: Reanimation Protocols
  ability_type: triggered
  source: faction_rule
  rule_text: Each time an enemy unit shoots or fights, after it makes its attacks, if any models in this
    unit were destroyed but this unit was not destroyed, this unit's reanimation protocols are enacted.
  trigger:
    timing: phase_reactive
    phase:
    - shooting
    - fight
    stage: end
    player: inactive
    event: after_enemy_attack
  conditions:
  - has_rules:
    - reanimationProtocols
    unit_not_destroyed: true
  effect:
    type: reanimate
    target: self
    amount: D6_per_wound
- id: wh40k_9e.necrons.faction.protocol_eternal_guardian
  name_en: Protocol of the Eternal Guardian
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: nihilakh
  primary: +1 to all saving throws until next Command phase
  secondary: Re-roll saving throws of 1
  directives:
    primary:
      effect:
        type: save_modifier
        value: 1
        phase: any
    secondary:
      effect:
        type: reroll_save_1
        phase: any
- id: wh40k_9e.necrons.faction.protocol_hungry_void
  name_en: Protocol of the Hungry Void
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: novokh
  primary: +1 to hit (Shooting)
  secondary: +1 Strength (Shooting weapons)
  directives:
    primary:
      effect:
        type: hit_modifier
        value: 1
        phase: shooting
    secondary:
      effect:
        type: strength_modifier
        value: 1
        phase: shooting
- id: wh40k_9e.necrons.faction.protocol_conquering_tyrant
  name_en: Protocol of the Conquering Tyrant
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: sautekh
  primary: +1 Leadership
  secondary: Re-roll hit and wound rolls of 1 (Melee)
  directives:
    primary:
      effect:
        type: leadership_bonus
        value: 1
        phase: any
    secondary:
      effect:
        type: reroll_hit_wound_1
        phase: melee
- id: wh40k_9e.necrons.faction.protocol_sudden_storm
  name_en: Protocol of the Sudden Storm
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: nephrekh
  primary: +1" Move
  secondary: Can Advance and Charge in the same turn
  directives:
    primary:
      effect:
        type: move_bonus
        value: 1
        phase: movement
    secondary:
      effect:
        type: advance_and_charge
        phase: charge
- id: wh40k_9e.necrons.faction.protocol_undying_legions
  name_en: Protocol of the Undying Legions
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: szarekhan
  primary: Re-roll Reanimation Protocols
  secondary: +1 model returned per Reanimation Protocol
  directives:
    primary:
      effect:
        type: rp_reroll
        phase: any
    secondary:
      effect:
        type: rp_bonus
        value: 1
        phase: any
- id: wh40k_9e.necrons.faction.protocol_vengeful_stars
  name_en: Protocol of the Vengeful Stars
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: mephrit
  primary: +1 to wound rolls (Shooting)
  secondary: Improve AP of Shooting weapons by 1
  directives:
    primary:
      effect:
        type: wound_modifier
        value: 1
        phase: shooting
    secondary:
      effect:
        type: ap_bonus
        value: -1
        phase: shooting
# Cryptek Arkana (Codex Necrons 9E, p. 61). Migrated from arkana.yaml / points.yaml
# (Plan 021): data move + generic loader only. ability_type is a STOPGAP marker
# ("not yet engine-dispatched") — the rule texts contain real trigger/conditions/
# effect; modelling those + protocol condition-visibility is a follow-up plan.
- id: wh40k_9e.necrons.arkana.failsafe_overcharger
  name_en: Failsafe Overcharger
  ability_type: descriptive
  category: arkana
  power_delta: 2
  cost_pts: 30
  description: 'Nur für ein TECHNOMANT-Modell. In deiner Befehlsphase kannst du eine befreundete KANOPTECH-Einheit innerhalb von 9 Zoll um den Träger auswählen. Addiere bis zum Beginn deiner nächsten Befehlsphase 1 zum Attackenwert der Modelle der gewählten Einheit. Wenn die Einheit eine MONSTER- oder FAHRZEUG-Einheit ist, addiere W3 zum Attackenwert der Modelle statt 1.'
- id: wh40k_9e.necrons.arkana.countertemporal_nanomines
  name_en: Countertemporal Nanomines
  ability_type: descriptive
  category: arkana
  power_delta: 2
  cost_pts: 30
  description: 'Nur für ein CHRONOMANT-Modell. In deiner Fernkampfphase kannst du eine feindliche Einheit innerhalb von 18 Zoll um den Träger auswählen. Halbiere bis zum Beginn deines nächsten Zuges jeden Vorrücken- und Angriffswurf für die gewählte Einheit.'
- id: wh40k_9e.necrons.arkana.atavindicator
  name_en: Atavindicator
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 25
  description: 'Nur für ein PSYCHOMANT-Modell. Wähle am Ende deiner Bewegungsphase eine feindliche Einheit (ausgenommen FAHRZEUG-Einheiten) innerhalb von 18 Zoll um den Träger und wirf 3W6; wenn die Summe dem Moralwert der gewählten Einheit entspricht oder höher ist, erleidet die feindliche Einheit W3 tödliche Verwundungen.'
- id: wh40k_9e.necrons.arkana.dimensional_sanctum
  name_en: Dimensional Sanctum
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 15
  grants_ability: wh40k_9e.necrons.unit.dimensional_translocation
  description: 'Der Träger erhält die Fähigkeit Dimensionale Translokation (Seite 80).'
- id: wh40k_9e.necrons.arkana.hypermaterial_ablator
  name_en: Hypermaterial Ablator
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 25
  description: 'In deiner Befehlsphase kannst du eine befreundete <DYNASTIE>-KERN- oder <DYNASTIE>-KANOPTECH-Einheit innerhalb von 9 Zoll um den Träger auswählen. Bis zum Beginn deiner nächsten Befehlsphase wird die gewählte Einheit bei jeder Fernkampfattacke gegen sich behandelt, als profitiere sie von leichter Deckung.'
- id: wh40k_9e.necrons.arkana.cortical_subjugator_scarabs
  name_en: Cortical Subjugator Scarabs
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 15
  description: 'Einmal pro Schlacht kannst du zu Beginn des Schritts Heroische Interventionen in der Angriffsphase deines Gegners eine befreundete <DYNASTIE>-Einheit innerhalb von 6 Zoll um den Träger auswählen. Sofern sich die Einheit nicht in Nahkampfreichweite einer feindlichen Einheit befindet, kann sie wie ein CHARAKTERMODELL eine Heroische Intervention durchführen.'
- id: wh40k_9e.necrons.arkana.cryptogeometric_adjuster
  name_en: Cryptogeometric Adjuster
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 15
  description: 'Zu Beginn der Fernkampfphase deines Gegners kannst du eine feindliche Einheit auswählen, die sich innerhalb von 12 Zoll befindet und für den Träger sichtbar ist. Ziehe bis zum Ende der Phase bei jeder Attacke eines Modells der gewählten Einheit 1 vom Trefferwurf ab.'
- id: wh40k_9e.necrons.arkana.metalodermal_tesla_weave
  name_en: Metalodermal Tesla Weave
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 20
  description: 'Am Ende des Schritts Angriffe in der Angriffsphase deines Gegners kannst du eine feindliche Einheit auswählen, die in dieser Phase eine Angriffsbewegung innerhalb von 6 Zoll um den Träger beendet hat. Wirf einen W6; bei 2+ erleidet die feindliche Einheit W3 tödliche Verwundungen.'
- id: wh40k_9e.necrons.arkana.photonic_transubjector
  name_en: Photonic Transubjector
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 20
  description: 'Einmal pro Zug, wenn das erste Mal ein Schutzwurf für den Träger misslingt, wird der Schadenswert der Attacke zu 0 geändert.'
- id: wh40k_9e.necrons.arkana.phylacterine_hive
  name_en: Phylacterine Hive
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 20
  description: 'Nur für ein TECHNOMANT-Modell. Einmal pro Schlacht kannst du, wenn der Träger seine Fähigkeit Riten der Reanimation einsetzt, eine befreundete <DYNASTIE>-KANOPTECH-, <DYNASTIE>-DESTRUKTORKULT- oder TRIARCHAT-PRÄTORIANER-Einheit auswählen, die statt einer befreundeten <DYNASTIE>-KERN-Einheit von der Fähigkeit betroffen wird.'
- id: wh40k_9e.necrons.arkana.prismatic_obfuscatron
  name_en: Prismatic Obfuscatron
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 20
  description: 'Solange der Träger nicht das nächste infrage kommende Ziel ist, können feindliche Modelle ihn nicht als Ziel für Fernkampfattacken auswählen.'
- id: wh40k_9e.necrons.arkana.quantum_orb
  name_en: Quantum Orb
  ability_type: descriptive
  category: arkana
  power_delta: 1
  cost_pts: 20
  description: 'Nur für ein PLASMANT-Modell. Einmal pro Schlacht kann der Träger in deiner Befehlsphase diesen Gegenstand der Kryptomanten-Arkana aktivieren. Wähle einen beliebigen Punkt auf dem Schlachtfeld innerhalb von 24 Zoll um den Träger. Wirf zu Beginn deiner nächsten Befehlsphase einen W6 für jede Einheit innerhalb von 6 Zoll um diesen Punkt.'
