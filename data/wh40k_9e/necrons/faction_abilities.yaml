faction: Necrons
# Generic subfaction binding (see armyCard subfaction badge): which roster field
# carries this faction's subfaction choice, and how to label it in the UI.
subfaction_field: dynasty
subfaction_label: Dynasty
round_choice_label: Command Protocols
abilities:
- id: wh40k_9e.necrons.faction.living_metal
  name_en: Living Metal
  ability_type: triggered
  source: faction_rule
  rule_text: At the start of your Command phase, each model in this unit regains 1 lost wound.
  trigger:
    timing: phase_start
    phase: command
    stage: start
    player: active
  conditions:
  - has_rules:
    - livingMetal
    unit_not_destroyed: true
    needs_healing: true
  effect:
    type: heal
    target: self
    amount: '1'
    revive: false
- id: wh40k_9e.necrons.faction.reanimation_protocols
  name_en: Reanimation Protocols
  ability_type: triggered
  source: faction_rule
  rule_text: Each time an enemy unit shoots or fights, after it makes its attacks, if any models in this
    unit were destroyed but this unit was not destroyed, this unit's reanimation protocols are enacted.
  trigger:
    timing: phase_reactive
    phase:
    - shooting
    - fight
    stage: end
    player: inactive
    event: after_enemy_attack
  conditions:
  - has_rules:
    - reanimationProtocols
    unit_not_destroyed: true
  effect:
    type: reanimate
    target: self
    amount: D6_per_wound
- id: wh40k_9e.necrons.faction.protocol_eternal_guardian
  name_en: Protocol of the Eternal Guardian
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: nihilakh
  primary: "Each time an attack is made against this unit, if it did not make a Normal Move, Advance or Fall Back this battle round, this unit receives the benefit of Light Cover"
  secondary: "When an enemy declares a charge against this unit and it is not in Engagement Range: Hold Steady (Overwatch hits on 5+) or Set to Defend (no Overwatch, but +1 Hit in next Fight phase)"
  directives:
    primary:
      effect:
        type: light_cover_if_stationary
        phase: any
    secondary:
      # 9E Directive 2: Hold Steady / Set to Defend. Real attack-sequence effect, but
      # its wiring depends on Plan 015 Overwatch (not yet built). Modelled as table-only
      # transition so Step 4 carries the correct 9E text without claiming a dead engine
      # effect. TODO: replace `enforcement: table` with real effect types
      # (overwatch_hit_threshold / hit_bonus_next_fight) in the dedicated D2 plan.
      effect:
        type: hold_steady_or_set_to_defend
        phase: any
        enforcement: table
- id: wh40k_9e.necrons.faction.protocol_hungry_void
  name_en: Protocol of the Hungry Void
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: novokh
  primary: 'Melee: unmodified wound roll of 6 improves this attack''s AP by 1'
  secondary: 'Melee: +1 Strength if this unit charged, was charged, or made a Heroic Intervention'
  directives:
    primary:
      effect:
        type: ap_on_unmod_wound_6
        value: 1
        phase: melee
    secondary:
      effect:
        type: strength_if_charged
        value: 1
        phase: melee
- id: wh40k_9e.necrons.faction.protocol_conquering_tyrant
  name_en: Protocol of the Conquering Tyrant
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: sautekh
  primary: "Add 3\" to the range of this unit's aura abilities (to a maximum of 12\"),
    including Lord's Will, My Will Be Done, and Rites of Reanimation"
  secondary: "This unit is eligible to shoot in a turn in which it Fell Back, but if
    it does, subtract 1 from each ranged attack's hit roll until the end of the turn"
  directives:
    primary:
      # 9E Directive 1: +3" aura range. Class B — table-only (no spatial tracking in App).
      effect:
        type: aura_range_bonus
        value: 3
        max: 12
        phase: any
        enforcement: table
    secondary:
      # 9E Directive 2: shoot after Fall Back with −1 Hit. Class A — App computes the
      # hit penalty when movement_choice == "fall_back".
      effect:
        type: shoot_after_fall_back
        hit_modifier: -1
        phase: shooting
- id: wh40k_9e.necrons.faction.protocol_sudden_storm
  name_en: Protocol of the Sudden Storm
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: nephrekh
  primary: +1" Move
  secondary: If performing an Action, can still make ranged attacks without it failing
  directives:
    primary:
      effect:
        type: move_bonus
        value: 1
        phase: movement
    secondary:
      # 9E Directive 2: table-only (B-hint), no engine computation. App surfaces a hint.
      effect:
        type: shoot_during_action
        phase: any
- id: wh40k_9e.necrons.faction.protocol_undying_legions
  name_en: Protocol of the Undying Legions
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: szarekhan
  # Slots ordered to match 9E directive numbering: Primary = Directive 1, Secondary = Directive 2.
  primary: +1 wound restored each Living Metal use
  secondary: Re-roll one Reanimation Protocol die
  directives:
    primary:
      effect:
        type: heal_bonus
        target_rule: livingMetal
        value: 1
        phase: any
    secondary:
      effect:
        type: rp_reroll
        phase: any
- id: wh40k_9e.necrons.faction.protocol_vengeful_stars
  name_en: Protocol of the Vengeful Stars
  ability_type: round_choice
  source: faction_rule
  subfaction_affinity: mephrit
  primary: 'Ranged: unmodified wound roll of 6 improves this attack''s AP by 1'
  secondary: 'Ranged: target gains no benefit from Light Cover when the firing model is within half range'
  directives:
    primary:
      effect:
        type: ap_on_unmod_wound_6
        value: 1
        phase: shooting
    secondary:
      # 9E Directive 2: class B/hybrid — half-range is a table measurement; App
      # surfaces the hint inline at the Light Cover checkbox (ignore_cover_half_range).
      effect:
        type: ignore_cover_half_range
        phase: shooting
# Cryptek Arkana (Codex Necrons 9E, p. 61). Migrated from arkana.yaml / points.yaml
# (Plan 021): data move + generic loader only. ability_type is a STOPGAP marker
# ("not yet engine-dispatched") — the rule texts contain real trigger/conditions/
# effect; modelling those + protocol condition-visibility is a follow-up plan.
- id: wh40k_9e.necrons.arkana.failsafe_overcharger
  name_en: Failsafe Overcharger
  ability_type: activated
  category: arkana
  source: arkana
  power_delta: 2
  cost_pts: 25
  active_text: "+1 Attacks · CANOPTEK in 9\""
  rule_text: "TECHNOMANCER model only. In your Command phase, select one friendly
    CANOPTEK unit within 9\" of the bearer. Until the start of your next Command
    phase, add 1 to the Attacks characteristic of models in that unit (add D3
    instead if it is a MONSTER or VEHICLE unit). The D3 variant is table-side only."
  trigger:
    timing: phase_any
    phase: command
    player: active
  conditions:
    - has_keywords: [TECHNOMANCER]
      once_per_battle: false
  effect:
    type: multi
    effects:
      - type: buff_stat
        target: friendly_canoptek
        target_keywords: [CANOPTEK]
        stat: attacks
        modifier: 1
- id: wh40k_9e.necrons.arkana.countertemporal_nanomines
  name_en: Countertemporal Nanomines
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 2
  cost_pts: 25
  rule_text: "CHRONOMANCER model only. In your Shooting phase, you can select one enemy
    unit within 18\" of the bearer. Until the start of your next turn, halve Advance
    rolls and charge rolls made for that unit."
  trigger:
    timing: phase_any
    phase: shooting
    player: active
  conditions:
    - has_keywords: [CHRONOMANCER]
  effect:
    type: halve_movement
    affects: [advance_roll, charge_roll]
    target_keywords: []
- id: wh40k_9e.necrons.arkana.atavindicator
  name_en: Atavindicator
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 20
  rule_text: "PSYCHOMANCER model only. At the end of your Movement phase, select one enemy
    unit (excluding VEHICLE units) within 18\" of the bearer and roll 3D6: if the total
    is equal to or greater than that enemy unit's Leadership characteristic, it suffers
    D3 mortal wounds."
  trigger:
    timing: phase_end
    phase: movement
    player: active
  conditions:
    - has_keywords: [PSYCHOMANCER]
  effect:
    type: mortal_wounds
    roll: 3d6
    threshold: target_leadership
    wounds: d3
    target_keywords: []
- id: wh40k_9e.necrons.arkana.dimensional_sanctum
  name_en: Dimensional Sanctum
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 10
  grants_ability: wh40k_9e.necrons.unit.dimensional_translocation
  rule_text: "The bearer gains the Dimensional Translocation ability."
  trigger:
    timing: persistent
    phase: any
    player: either
  conditions: []
  effect:
    type: ability_grant
    ability_id: wh40k_9e.necrons.unit.dimensional_translocation
- id: wh40k_9e.necrons.arkana.hypermaterial_ablator
  name_en: Hypermaterial Ablator
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 20
  rule_text: "In your Command phase, you can select one friendly <DYNASTY> CORE or
    <DYNASTY> CANOPTEK unit within 9\" of the bearer. Until the start of your next
    Command phase, each time a ranged attack is made against that unit, if the attacker
    is more than 12\" away, then the unit you selected is treated as having the benefits
    of light cover."
  trigger:
    timing: phase_any
    phase: command
    player: active
  conditions: []
  effect:
    type: cover_grant
    cover_type: light_cover
    target_keywords: [CORE]
    target_keywords_any: [CORE, CANOPTEK]
- id: wh40k_9e.necrons.arkana.cortical_subjugator_scarabs
  name_en: Cortical Subjugator Scarabs
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 10
  rule_text: "Once per battle, at the start of the Heroic Interventions step of your
    opponent's Charge phase, you can select one friendly <DYNASTY> unit within 6\" of
    the bearer. Unless that unit is within Engagement Range of any enemy units, it can
    perform a Heroic Intervention as if it were a CHARACTER."
  trigger:
    timing: phase_start
    phase: charge
    player: enemy
  conditions:
    - once_per_battle: true
  effect:
    type: hi_grant
    target_keywords: [DYNASTY]
- id: wh40k_9e.necrons.arkana.cryptogeometric_adjuster
  name_en: Cryptogeometric Adjuster
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 10
  rule_text: "At the start of your opponent's Shooting phase, you can select one enemy
    unit that is within 12\" of and visible to the bearer. Until the end of the phase,
    each time a model in that unit makes an attack, subtract 1 from that attack's hit
    roll."
  trigger:
    timing: phase_start
    phase: shooting
    player: enemy
  conditions: []
  effect:
    type: hit_debuff
    modifier: -1
    applies_to: attacks_made_by_target
    target_keywords: []
- id: wh40k_9e.necrons.arkana.metalodermal_tesla_weave
  name_en: Metalodermal Tesla Weave
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 15
  rule_text: "At the end of the Charges step of your opponent's Charge phase, you can
    select one enemy unit that finished a charge move within 6\" of the bearer this
    phase. Roll one D6: on a 2+, that enemy unit suffers D3 mortal wounds."
  trigger:
    timing: phase_end
    phase: charge
    player: enemy
  conditions: []
  effect:
    type: mortal_wounds
    roll: 1d6
    threshold: 2
    wounds: d3
    target_keywords: []
- id: wh40k_9e.necrons.arkana.photonic_transubjector
  name_en: Photonic Transubjector
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 15
  rule_text: "Once per turn, the first time a saving throw is failed for the bearer,
    the Damage characteristic of that attack is changed to 0."
  trigger:
    timing: persistent
    phase: any
    player: either
  conditions:
    - once_per_turn: true
  effect:
    type: damage_nullify
    set_damage_to: 0
- id: wh40k_9e.necrons.arkana.phylacterine_hive
  name_en: Phylacterine Hive
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 15
  rule_text: "TECHNOMANCER model only. Once per battle, when the bearer uses its Rites
    of Reanimation ability, you can select one friendly <DYNASTY> CANOPTEK, <DYNASTY>
    DESTROYER CULT or TRIARCH PRAETORIAN unit to be affected by that ability instead
    of one friendly <DYNASTY> CORE unit."
  trigger:
    timing: persistent
    phase: any
    player: active
  conditions:
    - has_keywords: [TECHNOMANCER]
      once_per_battle: true
  effect:
    type: meta_ability
    modifies_ability: rites_of_reanimation
- id: wh40k_9e.necrons.arkana.prismatic_obfuscatron
  name_en: Prismatic Obfuscatron
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 15
  rule_text: "Unless the bearer is the closest eligible target, enemy models cannot
    target it with ranged attacks."
  trigger:
    timing: persistent
    phase: any
    player: either
  conditions: []
  effect:
    type: untargetable
    condition: not_closest_eligible_target
- id: wh40k_9e.necrons.arkana.quantum_orb
  name_en: Quantum Orb
  ability_type: descriptive
  category: arkana
  source: arkana
  power_delta: 1
  cost_pts: 15
  rule_text: "PLASMANCER model only. Once per battle, in your Command phase, the bearer
    can activate this item of Cryptek Arkana. If it does, select one point on the
    battlefield anywhere within 24\" of the bearer and place a marker on that point.
    At the start of your next Command phase, roll one D6 for each unit within 6\" of
    the centre of that marker, subtracting 1 if the unit is a CHARACTER. On a 4-5,
    that unit suffers D3 mortal wounds, and on a 6, that unit suffers 3 mortal wounds.
    The marker is then removed."
  trigger:
    timing: phase_any
    phase: command
    player: active
  conditions:
    - has_keywords: [PLASMANCER]
      once_per_battle: true
  effect:
    type: deferred_aoe_mortal_wounds
    aoe_radius_inches: 6
