faction: Necrons
abilities:

  # ── Universal Necron Rules ─────────────────────────────────────────────────

  - id: wh40k_9e.necrons.faction.living_metal
    name_en: Living Metal
    ability_type: triggered
    source: faction_rule
    rule_text: "At the start of your Command phase, each model in this unit regains 1 lost wound."
    trigger:
      timing: phase_start
      phase: command
      stage: start
      player: active
    conditions:
      - has_rules: [livingMetal]
        unit_not_destroyed: true
        needs_healing: true
    effect:
      type: heal
      target: self
      amount: "1"
      revive: false

  - id: wh40k_9e.necrons.faction.reanimation_protocols
    name_en: Reanimation Protocols
    ability_type: triggered
    source: faction_rule
    rule_text: "Each time an enemy unit shoots or fights, after it makes its attacks, if any models in this unit were destroyed but this unit was not destroyed, this unit's reanimation protocols are enacted."
    trigger:
      timing: phase_reactive
      phase:
        - shooting
        - fight
      stage: end
      player: inactive
      event: after_enemy_attack
    conditions:
      - has_rules: [reanimationProtocols]
        unit_not_destroyed: true
    effect:
      type: reanimate
      target: self
      amount: D6_per_wound

  # ── Passive Keyword Rules ──────────────────────────────────────────────────

  - id: wh40k_9e.necrons.faction.objective_secured
    name_en: Objective Secured
    ability_type: triggered
    source: faction_rule
    rule_text: "While this unit is within range of an objective marker, it controls that objective marker even if there are more enemy models within range of that objective marker."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [objectiveSecured]
    effect:
      type: objective_control
      target: self

  - id: wh40k_9e.necrons.faction.hardwired_for_destruction
    name_en: Hardwired for Destruction
    ability_type: triggered
    source: faction_rule
    rule_text: "Each time a model in this unit makes an attack, re-roll a hit roll of 1."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: active
    conditions:
      - has_rules: [hardwiredForDestruction]
    effect:
      type: reroll_hit
      target: self
      modifier: 1

  - id: wh40k_9e.necrons.faction.quantum_shielding
    name_en: Quantum Shielding
    ability_type: triggered
    source: faction_rule
    rule_text: "This model has a 5+ invulnerable save. In addition, each time an attack is allocated to this model, if the unmodified wound roll for that attack was 1, 2, or 3, the attack fails and the attack sequence ends."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [quantumShielding]
    effect:
      type: invuln_save
      target: self
      modifier: 5

  - id: wh40k_9e.necrons.faction.phase_shifter
    name_en: Phase Shifter
    ability_type: triggered
    source: faction_rule
    rule_text: "This model has a 4+ invulnerable save."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [phaseShifter]
    effect:
      type: invuln_save
      target: self
      modifier: 4

  - id: wh40k_9e.necrons.faction.wraith_form
    name_en: Wraith Form
    ability_type: triggered
    source: faction_rule
    rule_text: "Models in this unit have a 4+ invulnerable save."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_rules: [wraith_form]
    effect:
      type: invuln_save
      target: self
      modifier: 4
