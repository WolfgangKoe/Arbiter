schema: tabletop.weapon_catalog.v1
game_system: wh40k_9e
faction: necrons

# Schicht 1 (Stammdaten) fuer Necron-Waffen, Codex 9e. Angelegt mit
# NX-2a-Abschluss am 2026-05-23 ueber acht Batches:
#   1 HQ-Charakter (#1-#28)
#   2 Standardtrupp (#29-#32)
#   3 Destroyer-Kult (#33-#38)
#   4 Triarch & Gruftklingen (#39-#46)
#   5 Canoptek (#47-#56)
#   6 Fahrzeuge (#57-#66)
#   7 C'tan + Cryptothralls (#67-#73)
#   8 Forge World (#74-#82)
# Eintragsnummer aus dem Rollup steht als Kommentar ueber jedem
# Eintrag. Mehrmodi-Waffen liegen als EIN Eintrag mit profiles:-Liste
# (Memory feedback-weapon-multimode-schema). Twin-Waffen sind eigen-
# staendige Codex-Waffen mit eigenem Eintrag (Memory
# feedback-bsdata-fallback-suche). DE-Felder fuehren die Codex-Soll-
# Form, auch wo necrons.translations.de.yaml noch eine Drift-Form
# fuehrt - die Sammelkorrektur dort folgt in NX-2c/e.

