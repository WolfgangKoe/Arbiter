- id: wh40k_9e.necrons.wargear.canoptek_cloak
  name_en: Canoptek Cloak
  name_de: Kanoptechmantel
  ability_en: >-
    The bearer has a Move characteristic of 10" and the FLY keyword.
    In addition, at the end of your Movement phase, you can repair
    one friendly <DYNASTY> model within 3" of this model. That model
    regains up to D3 lost wounds. Each model can only be repaired
    once per turn.
  ability_de: >-
    Der Träger hat einen Bewegungswert von 10 Zoll und das
    Schlüsselwort FLIEGEN. Zusätzlich kannst du am Ende deiner
    Bewegungsphase ein befreundetes <DYNASTIE>-Modell innerhalb von
    3 Zoll um dieses Modell reparieren. Jenes Modell erhält bis zu
    W3 verlorene Lebenspunkte zurück. Jedes Modell kann nur einmal
    pro Zug repariert werden.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23
  persistent_effects:
    - type: set_stat
      stat: move
      value: "10\""
    - type: grant_keyword
      keyword: FLY
  ability_type: triggered
  rule_text: "The bearer has a Move characteristic of 10\" and the FLY keyword. In addition, at the end of your Movement phase, you can repair one friendly DYNASTY model within 3\" of this model. That model regains up to D3 lost wounds."
  trigger:
    timing: phase_end
    phase: movement
    stage: end
    player: active
  conditions: []
  effect:
    type: complex
    target: friendly_dynasty
    handler: canoptekCloak

- id: wh40k_9e.necrons.wargear.canoptek_control_node
  name_en: Canoptek Control Node
  name_de: Kanoptech-Kontrollknoten
  ability_en: >-
    The bearer has the following ability: 'Control Node (Aura):
    While a friendly <DYNASTY> CANOPTEK unit is within 6" of this
    model, each time a model in that unit makes an attack, add 1 to
    that attack's hit roll.'
  ability_de: >-
    Der Träger hat folgende Fähigkeit: Kontrollknoten (Aura):
    Solange sich eine befreundete <DYNASTIE>-KANOPTECH-Einheit
    innerhalb von 6 Zoll um dieses Modell befindet, addierst du bei
    jeder Attacke eines Modells jener Einheit 1 zum Trefferwurf.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23
  ability_type: triggered
  rule_text: "Aura: while a friendly DYNASTY CANOPTEK unit is within 6\" of this model, each time a model in that unit makes an attack, add 1 to that attack's hit roll."
  trigger:
    timing: persistent
    phase: any
    stage: active
    player: active
  conditions: []
  effect:
    type: buff_roll
    target: friendly_canoptek_aura
    stat: hit_roll
    modifier: 1

