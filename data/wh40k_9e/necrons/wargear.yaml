- id: wh40k_9e.necrons.wargear.resurrection_orb
  handler: resurrection_orb
  name_en: Resurrection Orb
  ability_en: Once per battle, in your Command phase, the bearer can use its resurrection orb. If it does,
    select one friendly <DYNASTY> unit within 6" of the bearer that is not at its Starting Strength and
    has not had its reanimation protocols enacted this phase. That unit's reanimation protocols are enacted,
    and every destroyed model in that unit begins to reassemble.
  ability_type: activated
  rule_text: Once per battle, in your Command phase, the bearer can use its resurrection orb. Select one
    friendly DYNASTY unit within 6" of the bearer that is not at its Starting Strength. That unit's reanimation
    protocols are enacted.
  trigger:
    timing: phase_any
    phase: command
    stage: active
    player: active
  conditions:
  - within_inches: 6
    once_per_battle: true
  effect:
    type: complex
    target: selected_unit
    handler: resurrectionOrb
