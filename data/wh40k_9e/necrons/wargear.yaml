entries:

# #1 Technomancer (Codex S. 90)
- id: wh40k_9e.necrons.wargear.canoptek_cloak
  name_en: Canoptek Cloak
  name_de: Kanoptechmantel
  ability_en: >-
    The bearer has a Move characteristic of 10" and the FLY keyword.
    In addition, at the end of your Movement phase, you can repair
    one friendly <DYNASTY> model within 3" of this model. That model
    regains up to D3 lost wounds. Each model can only be repaired
    once per turn.
  ability_de: >-
    Der Träger hat einen Bewegungswert von 10 Zoll und das
    Schlüsselwort FLIEGEN. Zusätzlich kannst du am Ende deiner
    Bewegungsphase ein befreundetes <DYNASTIE>-Modell innerhalb von
    3 Zoll um dieses Modell reparieren. Jenes Modell erhält bis zu
    W3 verlorene Lebenspunkte zurück. Jedes Modell kann nur einmal
    pro Zug repariert werden.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #2 Technomancer (Codex S. 90)
- id: wh40k_9e.necrons.wargear.canoptek_control_node
  name_en: Canoptek Control Node
  name_de: Kanoptech-Kontrollknoten
  ability_en: >-
    The bearer has the following ability: 'Control Node (Aura):
    While a friendly <DYNASTY> CANOPTEK unit is within 6" of this
    model, each time a model in that unit makes an attack, add 1 to
    that attack's hit roll.'
  ability_de: >-
    Der Träger hat folgende Fähigkeit: Kontrollknoten (Aura):
    Solange sich eine befreundete <DYNASTIE>-KANOPTECH-Einheit
    innerhalb von 6 Zoll um dieses Modell befindet, addierst du bei
    jeder Attacke eines Modells jener Einheit 1 zum Trefferwurf.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #3 Lychguard (Codex S. 94)
- id: wh40k_9e.necrons.wargear.dispersion_shield
  name_en: Dispersion Shield
  name_de: Dispersionsschild
  ability_en: >-
    The bearer has a 4+ invulnerable save. In addition, add 1 to
    armour saving throws made for the bearer.
  ability_de: >-
    Der Träger hat einen Rettungswurf von 4+. Addiere zusätzlich 1
    auf Rüstungswürfe für den Träger.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #4 Canoptek Spyder (Codex S. 101)
- id: wh40k_9e.necrons.wargear.fabricator_claw_array
  name_en: Fabricator Claw Array
  name_de: Fabrikatorklauenarray
  ability_en: >-
    At the end of your Movement phase, the bearer can repair one
    friendly <DYNASTY> VEHICLE model within 3" of it. That model
    regains up to D3 lost wounds. Each model can only be repaired
    once per turn.
  ability_de: >-
    Am Ende deiner Bewegungsphase kann der Träger ein befreundetes
    <DYNASTIE>-FAHRZEUG-Modell innerhalb von 3 Zoll reparieren.
    Jenes Modell erhält bis zu W3 verlorene Lebenspunkte zurück.
    Jedes Modell kann nur einmal pro Zug repariert werden.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #5 Canoptek Spyder, Canoptek Tomb Sentinel, Canoptek Tombstalker
# (Codex S. 101)
- id: wh40k_9e.necrons.wargear.gloom_prism
  name_en: Gloom Prism
  name_de: Düsterprisma
  ability_en: >-
    In your opponent's Psychic phase, the bearer's unit can attempt
    to deny one psychic power as if it were a PSYKER.
  ability_de: >-
    In der Psi-Phase deines Gegners kann die Einheit des Trägers
    versuchen, eine Psikraft zu bannen, als wäre sie ein PSIONIKER.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #6 Tomb Blade (Codex S. 102)
- id: wh40k_9e.necrons.wargear.nebuloscope
  name_en: Nebuloscope
  name_de: Nebuloskop
  ability_en: >-
    Each time the bearer makes a ranged attack, the target does not
    receive the benefits of cover against that attack.
  ability_de: >-
    Bei Fernkampfattacken des Trägers erhält das Ziel keine
    Deckungsvorteile.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #7 Lokhust Lord, Vargard Obyron (Codex S. 87). OP-2: DE-Name
# „Phylakterium" ueberschreibt translations.de.yaml-Drift
# „Phylakterie"; Sammelkorrektur dort in NX-2c/e.
- id: wh40k_9e.necrons.wargear.phylactery
  name_en: Phylactery
  name_de: Phylakterium
  ability_en: >-
    Each time this model uses its Living Metal ability, it regains
    up to D3 lost wounds instead of 1.
  ability_de: >-
    Jedes Mal, wenn dieses Modell seine Fähigkeit Lebendes Metall
    einsetzt, erhält es bis zu W3 statt 1 verlorenen Lebenspunkts
    zurück.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

# #8 Catacomb Command Barge, Lokhust Lord, Lord, Overlord
# (Codex S. 87)
- id: wh40k_9e.necrons.wargear.resurrection_orb
  name_en: Resurrection Orb
  name_de: Regeneratorsphäre
  ability_en: >-
    Once per battle, in your Command phase, the bearer can use its
    resurrection orb. If it does, select one friendly <DYNASTY> unit
    within 6" of the bearer that is not at its Starting Strength and
    has not had its reanimation protocols enacted this phase. That
    unit's reanimation protocols are enacted, and every destroyed
    model in that unit begins to reassemble.
  ability_de: >-
    Einmal pro Schlacht kann der Träger in deiner Befehlsphase seine
    Regeneratorsphäre einsetzen. Falls er dies tut, wähle eine
    befreundete <DYNASTIE>-Einheit innerhalb von 6 Zoll um den
    Träger, die sich nicht auf ihrer Anfangsstärke befindet und
    deren Reanimationsprotokolle in dieser Phase noch nicht
    ausgeführt wurden. Die Reanimationsprotokolle jener Einheit
    werden ausgeführt und jedes zerstörte Modell jener Einheit
    beginnt, sich wieder zusammenzusetzen.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23

