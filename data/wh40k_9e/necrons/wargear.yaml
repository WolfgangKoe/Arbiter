- id: wh40k_9e.necrons.wargear.resurrection_orb
  name_en: Resurrection Orb
  name_de: Regeneratorsphäre
  ability_en: >-
    Once per battle, in your Command phase, the bearer can use its
    resurrection orb. If it does, select one friendly <DYNASTY> unit
    within 6" of the bearer that is not at its Starting Strength and
    has not had its reanimation protocols enacted this phase. That
    unit's reanimation protocols are enacted, and every destroyed
    model in that unit begins to reassemble.
  ability_de: >-
    Einmal pro Schlacht kann der Träger in deiner Befehlsphase seine
    Regeneratorsphäre einsetzen. Falls er dies tut, wähle eine
    befreundete <DYNASTIE>-Einheit innerhalb von 6 Zoll um den
    Träger, die sich nicht auf ihrer Anfangsstärke befindet und
    deren Reanimationsprotokolle in dieser Phase noch nicht
    ausgeführt wurden. Die Reanimationsprotokolle jener Einheit
    werden ausgeführt und jedes zerstörte Modell jener Einheit
    beginnt, sich wieder zusammenzusetzen.
  grants_keywords: []
  source: { publication: Codex Necrons 9e }
  verification_status: verified_nx2b_2026-05-23
  ability_type: activated
  rule_text: "Once per battle, in your Command phase, the bearer can use its resurrection orb. Select one friendly DYNASTY unit within 6\" of the bearer that is not at its Starting Strength. That unit's reanimation protocols are enacted."
  trigger:
    timing: phase_any
    phase: command
    stage: active
    player: active
  conditions:
    - within_inches: 6
      max_uses: 1
  effect:
    type: complex
    target: selected_unit
    handler: resurrectionOrb

