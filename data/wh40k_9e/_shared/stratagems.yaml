# Shared (Core) stratagems — WH40k 9E
# Source: Wahapedia https://wahapedia.ru/wh40k9ed/the-rules/core-rules/ (scraped 2026-06-03)
# Available to every army regardless of faction.
#
# phase: "any" = show in every phase
# once_per_battle: true overrides once_per_phase

stratagems:

  - id: wh40k_9e.shared.stratagem.command_re_roll
    name_en: Command Re-Roll
    cp_cost: 1
    phase: [movement, psychic, shooting, charge, fight]  # not command: no rolls happen there
    stage: active
    player: both
    conditions: []
    once_per_phase: false
    timing: phase_reactive
    event: after_roll
    effect:
      type: reroll
    rule_text: "Use this Stratagem after you have made a hit roll, a wound roll, a damage roll, a saving throw, an Advance roll, a charge roll, a Psychic test, a Deny the Witch test or you have rolled the dice to determine the number of attacks made by a weapon. Re-roll that roll, test or saving throw."

  - id: wh40k_9e.shared.stratagem.cut_them_down
    name_en: Cut Them Down
    cp_cost: 1
    phase: movement
    stage: active
    player: inactive
    conditions: []
    once_per_phase: true
    timing: phase_reactive
    event: on_declaration  # triggers when enemy declares Fall Back
    effect:
      type: mortal_wounds
      amount: "1"
      target: enemy
    rule_text: "Use this Stratagem when an enemy unit Falls Back, before any models in that unit are moved. Roll one D6 for each model from your army that is within Engagement Range of that enemy unit; for each result of 6, that enemy unit suffers 1 mortal wound."

  - id: wh40k_9e.shared.stratagem.desperate_breakout
    name_en: Desperate Breakout
    cp_cost: 2
    phase: movement
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    # S134 static model (design_system.md §6.2): reactive => renders ONLY inline
    # (movementPhase resolution card); previously the central list showed it in
    # parallel (S134 "Doppler"). No `event` yet: the inline USE anchor (in-melee
    # unit not yet moved) is Paket-4 debt, delivered S134/S135.
    timing: phase_reactive
    effect:
      type: move
      handler: fall_back_through_models
    rule_text: "Use this Stratagem in your Movement phase. Select one unit from your army that has not been selected to move this phase and which is in Engagement Range with at least one enemy unit. Roll one D6 for each model in that unit; for each result of 1, one model in that unit of your choice is destroyed. Assuming that unit was not destroyed, it can now attempt to Fall Back, and when doing so its models can be moved across enemy models as if they were not there. Any model in that unit that ends its Fall Back move within Engagement Range of any enemy model is destroyed. Assuming the unit is not destroyed, it cannot do anything else this turn."

  - id: wh40k_9e.shared.stratagem.emergency_disembarkation
    name_en: Emergency Disembarkation
    cp_cost: 1
    phase: any  # triggers when TRANSPORT is destroyed — can happen in any phase
    stage: active
    player: both  # can occur in either player's turn
    conditions: [TRANSPORT]
    once_per_phase: false
    timing: phase_reactive
    event: on_destroy
    effect:
      type: disembark
      amount: "6"
    rule_text: "Use this Stratagem when a TRANSPORT model from your army is destroyed. All units that are embarked within that model can be set up wholly within 6\" of the destroyed model when they disembark instead of the normal 3\" before the model itself is removed from the battlefield. These units are not affected by the destroyed model's Explodes ability — instead roll one D6 for each model set up: one model (your choice) is destroyed for each roll of 1 or 2. Units cannot declare a charge or perform a Heroic Intervention in the same turn that they disembarked from a destroyed TRANSPORT model."

  - id: wh40k_9e.shared.stratagem.fire_overwatch
    name_en: Fire Overwatch
    cp_cost: 1
    phase: charge
    stage: active
    player: inactive
    conditions: []
    weapon_conditions: [RANGED]
    once_per_phase: true
    timing: phase_reactive
    event: on_declaration  # after charge is declared, before charge roll
    effect:
      type: shoot_reaction
    rule_text: "Use this Stratagem after an enemy unit has declared a charge against one or more units from your army. One of the units that was chosen as the target of that charge can fire Overwatch before the charge roll is made."

  - id: wh40k_9e.shared.stratagem.counter_offensive
    name_en: Counter-Offensive
    cp_cost: 2
    phase: fight
    stage: active
    player: both  # Fight phase alternates between both players (core_rules.txt:1941)
    conditions: []
    once_per_phase: true
    timing: phase_reactive
    event: on_declaration  # after enemy unit has fought
    effect:
      type: free_attack
    rule_text: "Use this Stratagem after an enemy unit has fought in this turn. Select one of your own eligible units and fight with it next."

  - id: wh40k_9e.shared.stratagem.insane_bravery
    name_en: Insane Bravery
    cp_cost: 2
    phase: morale
    stage: active
    player: both  # Morale phase alternates between both players (core_rules.txt:2094)
    conditions: []
    once_per_phase: false
    once_per_battle: true  # rule text: "once per battle"
    effect:
      type: auto_pass_morale
    rule_text: "Use this Stratagem before you take a Morale test for a unit in your army. That test is automatically passed (do not roll any dice). You can only use this Stratagem once per battle."
