      ability_ids:
        - wh40k_9e.orks.faction.waaagh_stage1
        - wh40k_9e.orks.faction.speedwaaagh_stage1

  - id: wh40k_9e.orks.unit.ghazghkull.ghazghkulls_waaagh_banner
    name_en: "Ghazghkull's Waaagh! Banner"
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.ghazghkull
    rule_text: "Aura: while a friendly ORK unit (excluding GHAZGHKULL THRAKA) is within 12\" of this model, add 1 to the Leadership of models in that unit."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_keywords: [GHAZGHKULL THRAKA]
    effect:
      type: buff_stat_aura
      target: friendly_orks_within_12
      stat: leadership
      modifier: 1

  # ── HQ — Named Characters ─────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.mad_dok_grotsnik.super_cybork_body
    name_en: Super Cybork Body
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.mad_dok_grotsnik
    rule_text: "This model has a 4+ feel no pain."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_keywords: [MAD DOK GROTSNIK]
    effect:
      type: fnp
      target: self
      modifier: 4

  - id: wh40k_9e.orks.unit.runtherd.runtherd_rule
    name_en: Runtherd
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.runtherd
    rule_text: "Friendly GRETCHIN units within 6\" of this model are never considered to be under half strength for the purposes of Mob Rule. In addition, while a friendly GRETCHIN unit is within 6\" of this model, that unit can re-roll Morale tests."
    trigger:
      timing: persistent
      phase: morale
      stage: active
      player: active
    conditions:
      - has_keywords: [RUNTHERD]
    effect:
      type: morale_support_aura
      target: friendly_gretchin_within_6

  # ── Troops ─────────────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.gretchin.gretchin_mob
    name_en: Gretchin Mob
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.gretchin
    rule_text: "Unless accompanied by a RUNTHERD, this unit must take a Morale test if it suffers any casualties. However, Gretchin units do not have the Objective Secured ability."
    trigger:
      timing: persistent
      phase: morale
      stage: active
      player: active
    conditions:
      - has_keywords: [GRETCHIN]
    effect:
      type: special_morale
      target: self

  - id: wh40k_9e.orks.unit.gretchin.cowardly
    name_en: Cowardly
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.gretchin
    rule_text: "Unless a friendly <CLAN> RUNTHERD model is within 6\" of this unit, each time a model in this unit makes a Combat Attrition test, subtract 1 from the result."
    trigger:
      timing: persistent
      phase: morale
      stage: active
      player: either
    conditions:
      - has_keywords: [GRETCHIN]
    effect:
      type: attrition_modifier
      modifier: -1
      target: self
      # condition_prompt/applies_when ride in the raw sub-effect list because the
      # Ability/Effect dataclasses have no first-class fields for them yet
      # (schema follow-up noted in Plan 018 / faction_abilities.md). Semantics:
      # applies_when: false = the modifier is active while the prompted table
      # condition is NOT ticked (Cowardly: no RUNTHERD nearby).
      effects:
        - condition_prompt: "Friendly RUNTHERD within 6\"?"
          applies_when: false

  # ── Elites — Kommandos ────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.kommandos.sneaky_gitz
    name_en: Sneaky Gitz
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.kommandos
    rule_text: "During deployment, you can set up this unit in hiding instead of placing it on the battlefield. At the end of any of your Movement phases, you can set it up anywhere on the battlefield that is more than 9\" from any enemy models."
    trigger:
