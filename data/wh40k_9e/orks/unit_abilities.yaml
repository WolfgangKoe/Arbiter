# Orks unit abilities — WH40k 9E
# Source: Wahapedia 2026-06-03 (https://wahapedia.ru/wh40k9ed/factions/orks/)
# Format mirrors data/wh40k_9e/necrons/unit_abilities.yaml
faction: Orks
abilities:

  # ── HQ — Warboss ──────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.warboss.call_da_waaagh
    name_en: Call Da Waaagh!
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.warboss
    rule_text: "Once per battle, in your Command phase, this WARBOSS can call a Waaagh! See the Waaagh! faction ability for full effects."
    trigger:
      timing: phase_any
      phase: command
      stage: active
      player: active
    conditions:
      - has_keywords: [WARBOSS]
        once_per_battle: true
    effect:
      type: activate_faction_ability
      ability_id: wh40k_9e.orks.faction.waaagh_stage1

  - id: wh40k_9e.orks.unit.warboss_warbike.call_da_speedwaaagh
    name_en: "Call Da Speedwaaagh!"
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.warboss_warbike
    rule_text: "Once per battle, in your Command phase, this SPEEDBOSS can call a Speedwaaagh! instead of a standard Waaagh!. See the Speedwaaagh! faction ability for full effects."
    trigger:
      timing: phase_any
      phase: command
      stage: active
      player: active
    conditions:
      - has_keywords: [SPEEDBOSS]
        once_per_battle: true
    effect:
      type: activate_faction_ability
      ability_id: wh40k_9e.orks.faction.speedwaaagh_stage1

  # ── HQ — Big Mek ──────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.big_mek.mekaniak
    name_en: Mekaniak
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.big_mek
    rule_text: "At the end of your Movement phase, this model can repair one friendly ORK VEHICLE or ORK WALKER model within 3\" of it. That model regains up to D3 lost wounds. Each model can only be repaired once per turn."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_keywords: [BIG MEK]
    effect:
      type: heal
      target: friendly_vehicle_or_walker_within_3
      amount: D3

  - id: wh40k_9e.orks.unit.big_mek_kff.kustom_force_field
    name_en: Kustom Force Field
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.big_mek_kff
    rule_text: "Friendly ORK VEHICLE and ORK WALKER models (excluding TITANIC models) within 9\" of this model have a 5+ invulnerable save against ranged attacks."
    trigger:
      timing: persistent
      phase: shooting
      stage: active
      player: either
    conditions:
      - has_rules: [kustomForceField]
    effect:
      type: invuln_save_aura
      target: friendly_ork_vehicle_walker_within_9
      modifier: 5
      ranged_only: true

  - id: wh40k_9e.orks.unit.mek.mekaniak
    name_en: Mekaniak
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.mek
    rule_text: "At the end of your Movement phase, this model can repair one friendly ORK VEHICLE or ORK WALKER model within 3\" of it. That model regains 1 lost wound. Each model can only be repaired once per turn."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_keywords: [MEK]
    effect:
      type: heal
      target: friendly_vehicle_or_walker_within_3
      amount: 1

  # ── HQ — Weirdboy ─────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.weirdboy.waaagh_energy
    name_en: "Waaagh! Energy"
    ability_type: passive
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.weirdboy
    rule_text: "This model knows the Smite psychic power and two additional powers from the Waaagh! Energy psychic powers list ('Eadbanger, Warpath, Da Jump, Fists of Gork, Da Krunch, Jabbin' Fingerz). In your Psychic phase, this model can attempt to manifest up to two psychic powers."
    trigger:
      timing: persistent
      phase: psychic
      stage: active
      player: active
    conditions:
      - has_keywords: [PSYKER, WEIRDBOY]
    effect:
      type: psyker_powers
      powers_per_turn: 2
      power_list: waaagh_energy

  - id: wh40k_9e.orks.unit.weirdboy.waaagh_juice
    name_en: "Waaagh! Juice"
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.weirdboy
    rule_text: "If this model attempts to manifest a psychic power during a battle round in which a friendly WARBOSS used the Call Da Waaagh! ability, add 2 to the Psychic test."
    trigger:
      timing: persistent
      phase: psychic
      stage: active
      player: active
    conditions:
      - has_keywords: [WEIRDBOY]
        waaagh_called_this_turn: true
    effect:
      type: buff_roll
      target: self
      stat: psychic_test
      modifier: 2

  # ── HQ — Painboy ──────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.unit.painboy.dok_tools
    name_en: Dok's Tools
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.painboy
    rule_text: "At the end of your Movement phase, this model can heal one friendly ORK INFANTRY or ORK CAVALRY model within 3\" of it (excluding VEHICLE and WALKER models). That model regains up to D3 lost wounds. Each model can only be healed once per turn."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_keywords: [PAINBOY]
    effect:
      type: heal
      target: friendly_ork_infantry_or_cavalry_within_3
