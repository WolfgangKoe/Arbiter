  - id: wh40k_9e.orks.unit.painboy.fnd
    name_en: Feel No Pain (Painboy Aura)
    ability_type: triggered
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.painboy
    rule_text: "While a friendly ORK INFANTRY or ORK CAVALRY unit (excluding VEHICLE and WALKER models) is within 6\" of this model, models in that unit have a 6+ feel no pain."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_keywords: [PAINBOY]
    effect:
      type: fnp_aura
      target: friendly_ork_infantry_or_cavalry_within_6
