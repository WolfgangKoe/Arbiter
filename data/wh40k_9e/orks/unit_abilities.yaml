  - id: wh40k_9e.orks.unit.ghazghkull.great_waaagh
    name_en: "The Great Waaagh!"
    ability_type: activated
    source: unit_ability
    unit_id: wh40k_9e.orks.unit.ghazghkull
    rule_text: "Once per battle, in your Command phase, Ghazghkull can call a Great Waaagh! combining both the standard Waaagh! and Speedwaaagh! effects simultaneously."
    trigger:
