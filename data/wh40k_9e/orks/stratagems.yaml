# Ork stratagems — WH40k 9E
# Source: Wahapedia 2026-06-03 (https://wahapedia.ru/wh40k9ed/factions/orks/)
# Format matches gameObjects/stratagem.py Stratagem dataclass (mirrors necrons/stratagems.yaml).
#
# conditions: unit must have ALL listed keywords to qualify.
# detachment: if set, stratagem requires this detachment type.
# phase: phase in which the stratagem may be used.
# stage: "start" | "active" | "end"
# player: "active" | "inactive" | "both"
# cp_cost: minimum CP cost; variable costs are explained in rule_text.
#
# EXCLUDED: Boarding Actions supplement stratagems, Speed Mob supplement,
#   Warzone Octarius Blood Axes supplement — incomplete rule texts on source page.
# EXCLUDED: Vigilus Defiant Specialist Detachment stratagems (S143/S144-Kodex-Abgleich,
#   Stakeholder-Entscheid S144): Quelle ist das Kampagnenbuch Imperium Nihilus:
#   Vigilus Defiant, nicht Codex: Orks.
#   Removed: BLITZ BRIGADE, DREAD WAAAGH!, KULT OF SPEED, STOMPA MOB (setup, 4);
#   OPENING SALVO, KRUSH 'EM, HOLD ON, BOYZ!, KUSTOM AMMO, TURBO-BOOSTAS,
#   STOMP, STOMP, STOMP!, STOMPA-PORTA (detachment rules, 7).
# INCLUDED: Core Ork stratagems (incl. Requisitions), Klan-specific stratagems.
#
# Total: 17 stratagems (2 Requisitions + 8 Core + 7 Klan)

stratagems:

  # ── Requisitions — Before Battle ──────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.big_boss
    name_en: Big Boss
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    once_per_battle: true
    effect:
      type: grant_warlord_trait
    rule_text: "Use this Stratagem before the battle, when you are mustering your army, if your WARLORD has the ORKS keyword. Select one ORKS CHARACTER model from your army (excluding your WARLORD) and determine one Warlord Trait for that model; that model is only regarded as your WARLORD for the purposes of that Warlord Trait. Each Warlord Trait in your army must be unique. You can only use this Stratagem once, unless you are playing a Strike Force battle (twice) or an Onslaught battle (three times)."

  - id: wh40k_9e.orks.stratagem.extra_gubbinz
    name_en: Extra Gubbinz
    cp_cost: 1
    phase: before_battle
    stage: active
    player: active
    conditions: []
    once_per_phase: true
    once_per_battle: true
    effect:
      type: grant_relic
    rule_text: "Use this Stratagem before the battle, when you are mustering your army, if your WARLORD has the ORKS keyword. Select one ORKS CHARACTER model from your army and give them one Relic (this must be a Relic they can have). Each Relic in your army must be unique, and you cannot use this Stratagem to give a model two Relics. You can only use this Stratagem once, unless you are playing a Strike Force battle (twice) or an Onslaught battle (three times)."

  # ── Core — Any Phase ──────────────────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.careen
    name_en: "Careen!"
    cp_cost: 1  # variable: 1CP normally, 2CP for WAGON or TITANIC
    phase: any  # triggers on destroy — can happen in any phase
    stage: active
    player: both  # your vehicle can be destroyed in either player's turn
    conditions: [VEHICLE]
    once_per_phase: false
    timing: phase_reactive
    event: on_destroy
    effect:
      type: move
      amount: "6"
    rule_text: "Use this Stratagem in any phase, when an ORKS VEHICLE model from your army that is not within Engagement Range of any enemy models is destroyed, before rolling to see if it explodes. That model can make a Normal Move of up to 6\" before resolving the explosion. If that VEHICLE has the WAGON or TITANIC keyword, this Stratagem costs 2CP; otherwise it costs 1CP."

  - id: wh40k_9e.orks.stratagem.breakin_heads
    name_en: "Breakin' Heads"
    cp_cost: 2
    phase: morale
    stage: active
    player: active
    conditions: [WARBOSS]
    once_per_phase: true
    effect:
      type: auto_pass_morale
    rule_text: "Use this Stratagem in the Morale phase, when a Morale test is failed for a <CLAN> unit (excluding GRETCHIN units) from your army that is within 3\" of any friendly <CLAN> WARBOSS or <CLAN> NOBZ units. That <CLAN> unit suffers D3 mortal wounds, and the Morale test is treated as having been passed."

  - id: wh40k_9e.orks.stratagem.orks_is_never_beaten
    name_en: "Orks is Never Beaten"
    cp_cost: 2
    phase: fight
    stage: active
    player: active
    conditions: [CHARACTER]
    once_per_phase: true
    timing: phase_reactive
    event: on_destroy
    effect:
      type: free_attack
    rule_text: "Use this Stratagem in the Fight phase, when an ORKS CHARACTER model from your army that has not already been selected to fight this phase is destroyed. Do not remove the model from the battlefield — instead, it can fight before being removed. If this model's unit is still locked in combat with any enemy units, it can fight even though it is destroyed."

  # ── Core — Fight Phase ────────────────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.get_stuck_in_ladz
    name_en: "Get Stuck In, Ladz!"
    cp_cost: 1  # variable: 1CP for ≤10 models, 2CP for 11+ models
    phase: fight
    stage: active
    player: active
    conditions: [BOYZ, BEAST SNAGGA]
    once_per_phase: true
    effect:
      type: move
    rule_text: "Use this Stratagem in the Fight phase, when a BOYZ or BEAST SNAGGA BOYZ unit from your army is selected to fight. Until the end of the phase, each time a model in that unit makes a pile in or consolidation move, it can move up to an additional 3\". If the selected unit contains 10 or fewer models, this Stratagem costs 1CP; otherwise it costs 2CP."

  - id: wh40k_9e.orks.stratagem.hit_em_harder
    name_en: "Hit 'Em Harder"
    cp_cost: 2
    phase: fight
    stage: active
    player: active
    conditions: [MEGANOBZ]
    once_per_phase: true
    effect:
      type: buff_stat
      stat: damage
      modifier: 1
    rule_text: "Use this Stratagem in the Fight phase, when a MEGANOBZ unit from your army is selected to fight. Until the end of the phase, each time a model in that unit makes an attack with a power klaw or killsaw, add 1 to that attack's Damage characteristic."
    modifier:
      roll_type: damage
      value: 1
      target: attacker
      expires_at: phase_end
      source_label: "Hit 'Em Harder"

  # ── Core — Shooting Phase ──────────────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.gun_crazy_show_offs
    name_en: "Gun Crazy Show Offs"
    cp_cost: 2
    phase: shooting
    stage: end
    player: active
    conditions: [FLASH GITZ]
    once_per_phase: true
    effect:
      type: free_attack
    rule_text: "Use this Stratagem at the end of your Shooting phase. Select one FLASH GITZ unit from your army; that unit can shoot again, but it must target the closest eligible enemy unit."

  # ── Core — Charge Phase ────────────────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.ramming_speed
    name_en: Ramming Speed
    cp_cost: 2
    phase: charge
    stage: active
    player: active
    conditions: [VEHICLE]
    once_per_phase: true
    effect:
      type: mortal_wounds
    rule_text: "Use this Stratagem in your Charge phase, when an ORKS VEHICLE unit from your army is selected to charge. Until the end of the phase, when making a charge roll for that unit, roll 3D6 instead of 2D6. Until the end of the phase, when that unit finishes a charge move, select one enemy unit that is within Engagement Range of it and roll one D6: on a 2+, that enemy unit suffers D3 mortal wounds."

  # ── Core — Any Phase (defensive) ──────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.tough_as_squig_hide
    name_en: "Tough as Squig-Hide"
    cp_cost: 2
    phase: any
    stage: active
    player: inactive
    conditions: [BEAST SNAGGA]
    once_per_phase: true
    timing: phase_reactive
    event: on_target
    effect:
      type: restriction
      stat: wound_threshold
    rule_text: "Use this Stratagem in any phase, when a BEAST SNAGGA INFANTRY, BEAST SNAGGA CAVALRY or BEAST SNAGGA MONSTER unit from your army is selected as the target of an attack. Until the end of the phase, each time an attack is made against that unit, an unmodified wound roll of 1, 2 or 3 for that attack fails, irrespective of any abilities."
    modifier:
      roll_type: wound
      value: -1
      target: defender
      expires_at: phase_end
      source_label: "Tough as Squig-Hide"

  # ── Klan Stratagems ────────────────────────────────────────────────────────

  - id: wh40k_9e.orks.stratagem.showin_off
    name_en: "Showin' Off"
    cp_cost: 1
    phase: shooting
    stage: active
    player: active
    conditions: [BAD MOONS]
    once_per_phase: true
    effect:
      type: buff_roll
      stat: hit
      modifier: 1
    rule_text: "Use this Stratagem in your Shooting phase, when a BAD MOONS CORE or BAD MOONS CHARACTER unit from your army is selected to shoot. Until the end of the phase, each time a model in that unit makes an attack with a Dakka weapon, an unmodified hit roll of 6 scores 1 additional hit."

  - id: wh40k_9e.orks.stratagem.ded_sneaky
    name_en: "Ded Sneaky"
    cp_cost: 1
    phase: movement
    stage: end
    player: active
    conditions: [BLOOD AXES, INFANTRY]
    once_per_phase: true
    effect:
      type: teleport
      stat: strategic_reserve
    rule_text: "Use this Stratagem at the end of your Movement phase, if the mission you are playing is using the Strategic Reserves rule. Select one BLOOD AXES INFANTRY unit from your army (excluding MEGA ARMOUR units) that is within 3\" of any battlefield edge. Place that unit in Strategic Reserve."

  - id: wh40k_9e.orks.stratagem.wreckaz
    name_en: Wreckaz
    cp_cost: 2
    phase: [shooting, fight]  # rule text: "Shooting phase or Fight phase"
    stage: start
    player: active
    conditions: [DEATHSKULLS]
    once_per_phase: true
    effect:
      type: buff_roll
      stat: wound
      modifier: 1
      target: attacker
    modifier:
      roll_type: wound
      value: 1
      target: attacker
      expires_at: phase_end
      source_label: "Wreckaz"
    rule_text: "Use this Stratagem at the start of your Shooting phase or Fight phase. Select one DEATHSKULLS CORE or DEATHSKULLS CHARACTER unit from your army. Until the end of the phase, each time a model in that unit makes an attack that targets a VEHICLE, add 1 to that attack's wound roll."

  - id: wh40k_9e.orks.stratagem.drive_by_dakka
    name_en: "Drive By Dakka"
    cp_cost: 1
    phase: shooting
    stage: end
    player: active
    conditions: [EVIL SUNZ, SPEED FREEKS]
    once_per_phase: true
    effect:
      type: move
    rule_text: "Use this Stratagem at the end of your Shooting phase. Select one EVIL SUNZ SPEED FREEKS unit from your army. That unit can immediately make a Normal Move as if it was your Movement phase. That unit is not eligible to charge this turn."

  - id: wh40k_9e.orks.stratagem.get_da_loot
    name_en: "Get Da Loot"
    cp_cost: 1
    phase: command
    stage: start
    player: active
    conditions: [FREEBOOTERZ, INFANTRY]
    once_per_phase: true
    effect:
      type: grant_ability
      stat: objective_secured
    rule_text: "Use this Stratagem at the start of your Command phase. Select one FREEBOOTERZ INFANTRY unit from your army that is on the battlefield. Until the start of your next Command phase, that unit gains the Objective Secured ability (if it already has this ability, each model in that unit counts as 2 models for the purpose of controlling objective markers instead)."

  - id: wh40k_9e.orks.stratagem.unbridled_carnage
    name_en: "Unbridled Carnage"
    cp_cost: 2
    phase: fight
    stage: start
    player: active
    conditions: [GOFFS]
    once_per_phase: true
    effect:
      type: buff_roll
      stat: hit
      modifier: 1
    rule_text: "Use this Stratagem at the start of the Fight phase. Select one GOFF CORE or GOFF CHARACTER unit from your army that has the No Mukkin' About Clan Kultur. Until the end of the phase, each time a model in that unit makes an attack, it scores an additional hit on an unmodified hit roll of 5+ instead of 6."

  - id: wh40k_9e.orks.stratagem.mystic_chanting
    name_en: "Mystic Chanting"
    cp_cost: 1
    phase: psychic
    stage: active
    player: inactive
    conditions: [SNAKEBITES]
    once_per_phase: true
    effect:
      type: grant_ability
      stat: deny_psychic
    rule_text: "Use this Stratagem during your opponent's Psychic phase. Select one SNAKEBITES unit from your army. Until the end of the phase, that unit can attempt to deny one psychic power as if it were a PSYKER (if that unit already has the PSYKER keyword, it can attempt to deny one additional psychic power instead)."

