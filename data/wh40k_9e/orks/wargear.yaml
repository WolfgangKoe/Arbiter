schema: tabletop.wargear_catalog.v1
game_system: wh40k_9e
faction: orks
# Source: Wahapedia 2026-06-03 (https://wahapedia.ru/wh40k9ed/factions/orks/)
# Format mirrors data/wh40k_9e/necrons/wargear.yaml

entries:

  - id: wh40k_9e.orks.wargear.cybork_body
    name_en: Cybork Body
    ability_en: >-
      This model has a 6+ feel no pain.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.ammo_runt
    name_en: Ammo Runt
    ability_en: >-
      Once per Shooting phase, the bearer can re-roll one hit roll when making
      ranged attacks. After re-rolling, remove the Ammo Runt from play for the
      rest of the battle (one use only).
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.bomb_squig
    name_en: Bomb Squig
    ability_en: >-
      Once per game, in your Shooting phase, you can use a Bomb Squig.
      Select one enemy VEHICLE unit within 6\" of the bearer and roll 2D6:
      if the total equals or exceeds the unit's Toughness characteristic,
      it suffers D3 mortal wounds.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.grot_oiler
    name_en: Grot Oiler
    ability_en: >-
      If the bearer has the Mekaniak ability and uses it in a turn, the bearer
      can repair one additional wound (i.e., regains up to D3+1 lost wounds).
      The Grot Oiler is removed from play after use (one use only per battle).
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.gitfindaz
    name_en: Gitfindaz
    ability_en: >-
      FLASH GITZ only. The bearer can target enemy units that are not the
      closest eligible target when making ranged attacks, ignoring the
      requirement to shoot the closest eligible unit.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.kustom_job_souped_up_driveshaft
    name_en: "Kustom Job: Souped-Up Driveshaft"
    ability_en: >-
      Vehicle only. Add 2\" to the Move characteristic of this model.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.kustom_job_ramming_spur
    name_en: "Kustom Job: Ramming Spur"
    ability_en: >-
      Vehicle only. At the end of a charge move made by this model, you can
      select one enemy unit within Engagement Range and roll one D6:
      on a 4+, that unit suffers D3 mortal wounds.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.kustom_job_extra_armour_platez
    name_en: "Kustom Job: Extra Armour Platez"
    ability_en: >-
      Vehicle only. Add 1 to armour saving throws made for this model.
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.big_choppa_nob
    name_en: Big Choppa (Nob)
    ability_en: >-
      Replaces a Choppa. The bearer gains +2 Strength on melee attacks made
      with this weapon (reflected in weapon profile).
    grants_keywords: []
    source: { publication: Codex Orks 9e }

  - id: wh40k_9e.orks.wargear.squig_bomb
    name_en: Squig Bomb
    ability_en: >-
      Kommandos only. Once per game, when this unit is set up from hiding,
      you can select one enemy unit within 3\" of the bearer and roll one D6:
      on a 2+, that unit suffers D3+1 mortal wounds.
    grants_keywords: []
    source: { publication: Codex Orks 9e }
