# Orks wargear abilities — WH40k 9E
# Source: Wahapedia 2026-06-03 (https://wahapedia.ru/wh40k9ed/factions/orks/)
# Format mirrors data/wh40k_9e/necrons/wargear_abilities.yaml
# These are the rule-engine representations of the wargear.yaml entries.
faction: Orks
abilities:

  - id: wh40k_9e.orks.wargear.cybork_body.ability
    name_en: Cybork Body
    ability_type: triggered
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.cybork_body
    rule_text: "This model has a 6+ feel no pain."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.cybork_body]
    effect:
      type: fnp
      target: self
      modifier: 6

  - id: wh40k_9e.orks.wargear.ammo_runt.ability
    name_en: Ammo Runt
    ability_type: activated
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.ammo_runt
    rule_text: "Once per Shooting phase, re-roll one hit roll when making ranged attacks. After using, the Ammo Runt is removed for the rest of the battle."
    trigger:
      timing: phase_any
      phase: shooting
      stage: active
      player: active
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.ammo_runt]
        once_per_battle: true
    effect:
      type: reroll_one_hit
      target: self
      uses: 1

  - id: wh40k_9e.orks.wargear.bomb_squig.ability
    name_en: Bomb Squig
    ability_type: activated
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.bomb_squig
    rule_text: "Once per game in your Shooting phase, select one enemy VEHICLE within 6\" and roll 2D6. If the total equals or exceeds the target's Toughness, it suffers D3 mortal wounds."
    trigger:
      timing: phase_any
      phase: shooting
      stage: active
      player: active
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.bomb_squig]
        once_per_battle: true
      - target_within_inches: 6
      - target_has_keyword: VEHICLE
    effect:
      type: mortal_wounds_conditional
      target: enemy_vehicle_selected
      amount: D3
      condition: 2d6_vs_toughness

  - id: wh40k_9e.orks.wargear.grot_oiler.ability
    name_en: Grot Oiler
    ability_type: triggered
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.grot_oiler
    rule_text: "When the bearer uses the Mekaniak ability, the target regains D3+1 wounds instead of D3. One use only — the Grot Oiler is removed after use."
    trigger:
      timing: phase_end
      phase: movement
      stage: end
      player: active
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.grot_oiler]
        once_per_battle: true
    effect:
      type: heal_bonus
      target: mekaniak_target
      bonus_amount: 1

  - id: wh40k_9e.orks.wargear.kustom_job_souped_up_driveshaft.ability
    name_en: "Kustom Job: Souped-Up Driveshaft"
    ability_type: triggered
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.kustom_job_souped_up_driveshaft
    rule_text: "Add 2\" to the Move characteristic of this model."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.kustom_job_souped_up_driveshaft]
    effect:
      type: buff_stat
      target: self
      stat: move
      modifier: 2

  - id: wh40k_9e.orks.wargear.kustom_job_extra_armour_platez.ability
    name_en: "Kustom Job: Extra Armour Platez"
    ability_type: triggered
    source: wargear_ability
    wargear_id: wh40k_9e.orks.wargear.kustom_job_extra_armour_platez
    rule_text: "Add 1 to armour saving throws made for this model."
    trigger:
      timing: persistent
      phase: any
      stage: active
      player: either
    conditions:
      - has_wargear: [wh40k_9e.orks.wargear.kustom_job_extra_armour_platez]
    effect:
      type: buff_save
      target: self
      modifier: 1
