[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "acceptance: pins a Given/When/Then acceptance criterion (docs/spec/acceptance/index.md).",
]

[tool.coverage.run]
omit = [
    "src/uiLayout/__init__.py",
    "src/uiLayout/_common.py",
    "src/uiLayout/armyCard.py",
    "src/uiLayout/armyList.py",
    "src/uiLayout/detachmentCard.py",
    "src/uiLayout/diceHtml.py",
    "src/uiLayout/gameActionsArea.py",
    "src/uiLayout/gameHeader.py",
    "src/uiLayout/gameProtocoll.py",
    "src/uiLayout/setupScreen.py",
    "src/uiLayout/unitCard.py",
    "src/app.py",
    "src/constants/*",
    "src/gameMechanic/commandPhase.py",
    "src/gameMechanic/chargePhase.py",
    "src/gameMechanic/fightPhase.py",
    "src/gameMechanic/moralePhase.py",
    "src/gameMechanic/movementPhase.py",
    "src/gameMechanic/psychicPhase.py",
    "src/gameMechanic/shootingPhase.py",
]

[tool.coverage.report]
# Ratchet: locks in the current measured level so coverage can only go up, never
# silently sink. Raised from 90 → 92 to lock in gains from the diceCompose.py
# seam (INV-6): pure composition logic now lives in a measured module. Raise this
# further as more logic is pulled out of the omitted render modules
# (uiLayout/*, *Phase.py) into tested helpers.
fail_under = 99
show_missing = true
