[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/uiLayout/*",
    "src/app.py",
    "src/constants/*",
    "src/gameMechanic/commandPhase.py",
    "src/gameMechanic/chargephase.py",
    "src/gameMechanic/fightPhase.py",
    "src/gameMechanic/moralePhase.py",
    "src/gameMechanic/movementPhase.py",
    "src/gameMechanic/psychicPhase.py",
    "src/gameMechanic/shootingPhase.py",
]

[tool.coverage.report]
# Ratchet: locks in the current measured level so coverage can only go up, never
# silently sink. Raise this as logic is pulled out of the omitted render modules
# (uiLayout/*, *Phase.py) into tested helpers — the path toward a higher target.
fail_under = 88
show_missing = true
