[tool.pytest.ini_options]
# Warum: Testdateien heißen `<name>Test.py` (prozess/praemissen/wir.md).
python_files = ["*Test.py"]
# Warum: Das Produkt `arbiter` liegt in technik/. Die Prüfskripte stehen nicht im Suchpfad:
# pytest stellt den Ordner einer Testdatei ohnehin vorne an, das Produkt soll sie nicht sehen.
pythonpath = ["technik"]
# Warum: `stand` kennzeichnet Prüfungen über das echte Repo; die Messung der Prüfskripte lässt sie aus
# (abdeckung.py), denn sie proben nur den grünen Weg.
markers = ["stand: prüft den Stand des Repos, keine Probe"]

[tool.ruff]
line-length = 100
extend-exclude = ["Arbiter-old", "ArbiterMap"]
# Warum: Ohne src hielte ruff `benennung`, `agenten` usw. für fremde Pakete (I001).
src = ["prozess/pruefungen", "technik"]

[tool.ruff.lint]
# Warum: Stil, ARG, PLR2004, PLR0913, FBT, ERA nach prozess/ablauf.md (Technikphase, Werkzeuge).
select = ["E", "W", "F", "I", "N", "UP", "B", "ARG", "PLR2004", "PLR0912", "PLR0913", "FBT", "ERA"]
# Warum: Bezeichner sind camelCase (wir.md), Ausnahmen heißen deutsch ohne „Error“ (N818);
# die Namensprüfung übernimmt prozess/pruefungen/benennung.py.
ignore = ["N802", "N803", "N806", "N815", "N816", "N818", "N999"]

[tool.ruff.lint.isort]
# Warum: Akzeptanztests importieren Module, bevor es sie gibt (CLAUDE.md, Technik-Rahmen).
known-first-party = ["arbiter"]

[tool.ruff.lint.pylint]
# Warum: Zahl der Fälle einer Funktion höchstens 12 (prozess/ablauf.md, Werkzeuge); die
# Verschachtelung begrenzt complexipy.
max-branches = 12

[tool.complexipy]
# Warum: Kognitive Komplexität einer Funktion höchstens 15, Verschachtelung zählt mit.
max-complexity-allowed = 15

[project]
name = "arbiter"
version = "0"
requires-python = ">=3.12"
# Warum: `arbiter.katalog` liest die Ausgangslage aus YAML (technik/architektur.md, A2);
# feste Minor-Version, damit ein Update nicht still das Leseverhalten ändert.
dependencies = ["PyYAML==6.0.*"]

[dependency-groups]
# Warum: ruff, complexipy, coverage und vulture mit fester Minor-Version, damit ein Update nicht still neue Regeln
# oder eine andere Zählweise bringt.
entwicklung = ["pytest", "ruff==0.16.*", "complexipy==8.0.*", "coverage==7.16.*", "vulture==2.16.*"]

[tool.coverage.report]
# Warum: Der Einstieg `if __name__ == "__main__":` ist nur Verdrahtung des Hooks (stdin, stdout);
# die Entscheidung davor prüfen die Einheiten.
exclude_also = ['if __name__ == "__main__":']

[tool.vulture]
# Warum: pytest ruft `test…` auf, kein Code; `zweite` ist ein Mitglied von `Aufstellungszone`,
# das `katalog/ausgangslage.py` aus den Daten liest (`Aufstellungszone[name]`).
ignore_names = ["test[A-Z]*", "zweite"]
