[tool.pytest.ini_options]
# Warum: Testdateien heißen `<name>Test.py` (prozess/praemissen/wir.md); `test_*.py` gilt nur,
# bis der Testautor technik/tests/akzeptanz umbenannt hat (benennung.py meldet den Rest).
python_files = ["*Test.py", "test_*.py"]
# Warum: Das Produkt `arbiter` liegt in technik/. Die Prüfskripte stehen nicht im Suchpfad:
# pytest stellt den Ordner einer Testdatei ohnehin vorne an, das Produkt soll sie nicht sehen.
pythonpath = ["technik"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Arbiter", "ArbiterMap"]
# Warum: Ohne src hielte ruff `benennung`, `agenten` usw. für fremde Pakete (I001).
src = ["prozess/pruefungen", "technik"]

[tool.ruff.lint]
# Werkzeugsatz nach VORGEHEN.md E37: Stil, ARG, PLR2004, PLR0913, FBT, ERA.
select = ["E", "W", "F", "I", "N", "UP", "B", "ARG", "PLR2004", "PLR0913", "FBT", "ERA"]
# Warum: Bezeichner sind camelCase (wir.md), Ausnahmen heißen deutsch ohne „Error“ (N818);
# die Namensprüfung übernimmt prozess/pruefungen/benennung.py.
ignore = ["N802", "N803", "N806", "N815", "N816", "N818", "N999"]

[dependency-groups]
# Warum: ruff mit fester Minor-Version, damit ein Update nicht still neue Regeln bringt.
entwicklung = ["pytest", "ruff==0.16.*"]
