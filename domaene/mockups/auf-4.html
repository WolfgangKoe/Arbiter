<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Arbiter</title>
  <link rel="stylesheet" href="vorschlag.css">
</head>
<body>
  <header class="kopfzeile">
    <div class="kopfzeileSpieler spieler1 anDerReihe">Spieler 1<span class="kopfzeileAnDerReihe">an der Reihe</span></div>
    <div class="kopfzeileTitel">ARBITER</div>
    <div class="kopfzeileSpieler spieler2">Spieler 2</div>
  </header>
  <main class="spielbereich">
    <aside class="spalte">
      <div class="armeeKarte spieler1">
        <h2 class="armeeKartenName">Spieler 1</h2>
      <section class="einheitenKarte inAufstellung">
        <div class="einheitenKartenName"><span>Boyz</span>
        <span class="einheitenKartenAbzeichen">in Aufstellung</span></div>
      </section>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Warboss</span><span class="einheitenKartenModelle">1</span></div>
      </section>
      </div>
    </aside>
    <div class="spalte spalteMitte">
    <svg class="karte" viewBox="0 0 44 60" role="img" aria-label="Karte">
      <rect class="spielfeld" x="0" y="0" width="44" height="60"/>
      <rect class="aufstellungszone spieler1" x="0" y="0" width="9" height="60"/>
      <rect class="aufstellungszone spieler2" x="35" y="0" width="9" height="60"/>
      <circle class="modell spieler1" cx="2.0" cy="20" r="0.630"/>
      <circle class="modell spieler1" cx="3.4" cy="20" r="0.630"/>
      <circle class="modell spieler1" cx="4.8" cy="20" r="0.630"/>
      <circle class="modell spieler1" cx="6.2" cy="20" r="0.630"/>
      <circle class="modell spieler1" cx="7.6" cy="20" r="0.630"/>
      <circle class="modell spieler1" cx="2.0" cy="21.4" r="0.630"/>
      <circle class="modell spieler1" cx="3.4" cy="21.4" r="0.630"/>
      <circle class="modell spieler1" cx="4.8" cy="21.4" r="0.630"/>
      <circle class="modell spieler1" cx="6.2" cy="21.4" r="0.630"/>
      <circle class="modell spieler1" cx="7.6" cy="21.4" r="0.630"/>
      <circle class="modell spieler2" cx="36.0" cy="28" r="0.630"/>
      <circle class="modell spieler2" cx="37.4" cy="28" r="0.630"/>
      <circle class="modell spieler2" cx="38.8" cy="28" r="0.630"/>
      <circle class="modell spieler2" cx="40.2" cy="28" r="0.630"/>
      <circle class="modell spieler2" cx="41.6" cy="28" r="0.630"/>
      <circle class="modell spieler2" cx="36.0" cy="29.5" r="0.630"/>
      <circle class="modell spieler2" cx="37.4" cy="29.5" r="0.630"/>
      <circle class="modell spieler2" cx="38.8" cy="29.5" r="0.630"/>
      <circle class="modell spieler2" cx="40.2" cy="29.5" r="0.630"/>
      <circle class="modell spieler2" cx="41.6" cy="29.5" r="0.630"/>
    </svg>
    </div>
    <aside class="spalte">
      <div class="armeeKarte spieler2">
        <h2 class="armeeKartenName">Spieler 2</h2>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Overlord</span><span class="einheitenKartenModelle">1</span></div>
      </section>
      </div>
    </aside>
  </main>
</body>
</html>
