<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Arbiter</title>
  <link rel="stylesheet" href="vorschlag.css">
</head>
<body>
  <header class="kopfzeile">
    <div class="kopfzeileSpieler spieler1">Spieler 1</div>
    <div class="kopfzeileTitel">ARBITER</div>
    <div class="kopfzeileSpieler spieler2">Spieler 2</div>
  </header>
  <main class="spielbereich">
    <aside class="spalte">
      <div class="armeeKarte spieler1">
        <h2 class="armeeKartenName">Spieler 1</h2>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Boyz</span><span class="einheitenKartenModelle">10</span></div>
      </section>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Warboss</span><span class="einheitenKartenModelle">1</span></div>
      </section>
      </div>
    </aside>
    <div class="spalte spalteMitte">
    <svg class="karte" viewBox="0 0 44 60" role="img" aria-label="Karte">
      <rect class="spielfeld" x="0" y="0" width="44" height="60"/>
      <rect class="aufstellungszone ohneSpieler" x="0" y="0" width="9" height="60"/>
      <rect class="aufstellungszone ohneSpieler" x="35" y="0" width="9" height="60"/>
    </svg>
    </div>
    <aside class="spalte">
      <div class="armeeKarte spieler2">
        <h2 class="armeeKartenName">Spieler 2</h2>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Necron Warriors</span><span class="einheitenKartenModelle">10</span></div>
      </section>
      <section class="einheitenKarte">
        <div class="einheitenKartenName"><span>Overlord</span><span class="einheitenKartenModelle">1</span></div>
      </section>
      </div>
    </aside>
  </main>
</body>
</html>
