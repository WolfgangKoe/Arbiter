# also je eine Modellart wie ArbiterMap/data/poc/units/<datei>:<zeile> (group).
# bewegungsweite: Zoll; Quelle Arbiter-old/data/wh40k_9e/necrons/units.yaml:<zeile> (move).
# durchmesser: mm der runden Base; Quelle ArbiterMap/data/poc/units/<datei>:<zeile> (base_mm).

Necron Warriors:            # units.yaml:148
  modellarten:
    Necron Warriors:        # necrons_necron_warriors.yaml:13
      bewegungsweite: 5     # units.yaml:160
      durchmesser: 32       # necrons_necron_warriors.yaml:15
Overlord:                   # units.yaml:15
