steps:
  - name: test
    image: python:3.12-slim
    commands:
      - pip install --quiet -r requirements.txt -r requirements-dev.txt
      - ruff check src/
      - black --check src/
      - isort --check-only src/
      - mypy src/ || true
      - pytest --tb=short

  - name: deploy
    image: alpine
    secrets:
      - source: hf_token
        target: HF_TOKEN
      - source: hf_username
        target: HF_USERNAME
    commands:
      - apk add --no-cache git rsync
      - |
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          SPACE="arbiter"
        else
          SPACE="arbiter-test"
        fi
      - git config --global user.email "ci@arbiter"
      - git config --global user.name "Arbiter CI"
      - git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE}" hf-space
      - >
        rsync -a --delete
        --exclude='.git'
        --exclude='.venv'
        --exclude='__pycache__'
        --exclude='*.pyc'
        --exclude='.env'
        --exclude='hf-space'
        --exclude='.woodpecker.yml'
        . hf-space/
      - cd hf-space && git add -A
      - cd hf-space && git diff --cached --quiet || git commit -m "Deploy from CodeBerg (${CI_COMMIT_SHA:0:7})" && git push
    depends_on:
      - test
    when:
      branch:
        - dev
        - main
